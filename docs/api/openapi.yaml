      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriberWrite" }
      responses:
        "201":
          description: Angelegt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriberAdmin" }
