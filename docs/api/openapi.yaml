    post:
      tags: [Admin – Content]
      operationId: createExternalLink
      summary: Eigene Komponente an externe koppeln
      description: >-
        Beide Komponenten müssen zur Seite gehören (sonst 404), eigene reine Gruppen sind nicht koppelbar (400),
        die Tags der eigenen Komponente gelten wie beim Bearbeiten (403). Idempotent: eine bestehende
        Kopplung liefert 200 statt 201. `external_component_id` darf eine ganze externe Gruppe
        sein (`is_group`); dann zählen alle aktuellen, nicht verschwundenen Mitglieder der Gruppe (dynamisch
        über `group_external_id`). Koppelt dieselbe Komponente eine Gruppe und einen ihrer Bausteine, ist das
        erlaubt und ändert den Status nicht, die Antwort trägt `warnings: ["overlaps_group"]`.
