    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Admin – Content]
      operationId: markAdminNotificationReadSystem
      summary: Eine Nachricht als gelesen markieren (systemweit)
      description: Idempotent. Eine Nachricht außerhalb des Umfangs (andere Seite, systemweit) ist 404.
