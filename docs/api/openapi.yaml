        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Admin – Subscribers]
      operationId: createSubscriber
      summary: Abonnent anlegen
      description: |
        E-Mail-Abonnenten bekommen eine Bestätigungsmail und bleiben bis dahin `pending`. Dieselbe
        Adresse bzw. Webhook-URL lässt sich je Seite nur einmal anlegen (`409`). Je Seite sind
        höchstens 30 neue E-Mail-Abos pro Stunde möglich, je Empfängeradresse höchstens 3
        unbestätigte Abos in 24 Stunden über alle Seiten (`429`, Code `subscriber_rate_limited`).
