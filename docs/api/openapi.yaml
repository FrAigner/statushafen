        schema: { $ref: "#/components/schemas/NotificationKind" }
      - name: audience
        in: path
        required: true
        schema: { type: string, enum: [staff, subscriber] }
      - name: language
        in: path
        required: true
        description: Aktiver Sprachcode aus dem Sprachkatalog.
        schema: { type: string }
    put:
      tags: [Admin – Settings]
      operationId: putNotificationTemplate
      summary: Mail-Vorlage anlegen/ersetzen
      description: |
        Erlaubt sind nur Platzhalter und einfache Bedingungen (`if`/`else` mit `eq`, `ne`, `not`,
        `and`, `or`); Schleifen, Unterschablonen, Variablen und andere Funktionen werden mit
        `template_construct_not_allowed` abgelehnt. Betreff höchstens 500 Bytes, Inhalt höchstens
        64 KB (`template_too_long`). Die Vorlage `subscription_confirm` muss `{{.ConfirmURL}}`
        unbedingt ausgeben (`template_confirm_url_missing`).
