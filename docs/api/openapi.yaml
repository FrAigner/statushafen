        "500": { $ref: "#/components/responses/InternalError" }
  /api/pages/{page_id}/external-incidents:
    parameters:
      - $ref: "#/components/parameters/PageId"
    get:
      tags: [Admin – Content]
      operationId: listExternalIncidents
      summary: Gespiegelte Vorfälle und Wartungen externer Quellen
      description: >-
        Vorfälle und Wartungen der aktiven externen Quellen der Seite, die
        mindestens eine gekoppelte Komponente betreffen (`affected_components` ist nie leer; direkte Kopplung
        oder über eine gekoppelte externe Gruppe). Offene zuerst, dann nach letzter Änderung. Beendete nur
        innerhalb von `days`. Abonnenten der betroffenen Komponenten werden per Mail bzw. Google-Chat-Webhook
        benachrichtigt (Quelle und Link stehen im Text); der erste Abruf einer Quelle ist still.
      x-required-permission: external_sources:read
      parameters:
        - { name: kind, in: query, required: false, schema: { type: string, enum: [incident, maintenance] } }
        - { name: state, in: query, required: false, schema: { type: string, enum: [open, closed] } }
        - { name: source_id, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: days, in: query, required: false, description: "Fenster für beendete Meldungen in Tagen (Standard 30).", schema: { type: integer, minimum: 1, maximum: 365 } }
        - { name: limit, in: query, required: false, description: "Standard 50.", schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200":
          description: Gespiegelte Meldungen.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExternalIncident" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/pages/{page_id}/external-incidents/{id}:
    parameters:
      - $ref: "#/components/parameters/PageId"
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Admin – Content]
      operationId: getExternalIncident
      summary: Eine gespiegelte Meldung
      description: 404, wenn sie nicht zu dieser Seite gehört oder keine gekoppelte Komponente betrifft.
      x-required-permission: external_sources:read
      responses:
        "200":
          description: Die Meldung.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalIncident" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/pages/{page_id}/external-sources/{id}/import:
    parameters:
      - $ref: "#/components/parameters/PageId"
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Admin – Content]
      operationId: importExternalComponents
      summary: Externe Bausteine als eigene Komponenten übernehmen und koppeln
      description: >-
        Legt pro gewähltem externen Baustein eine eigene Komponente (Name = externer Name,
        Status operational) unter `parent_id` an (eigene Gruppe derselben Seite, sonst 400; null/0 = oberste
        Ebene) und koppelt sie. Eine gewählte externe Gruppe wird als Gruppenkomponente mit ihren aktuellen
        Mitgliedern übernommen (die Gruppe selbst wird nicht gekoppelt). Bereits gekoppelte, verschwundene
        oder leere Gruppen landen in `skipped` (Grund `already_linked`, `vanished`, `empty_group`); ein
        wiederholter Aufruf legt nichts doppelt an (200 statt 201). Alles in einer Transaktion, höchstens 200
        IDs (sonst 400). Fremde IDs ergeben 404, Tag-Zugriff wie beim Anlegen einer Komponente (403).
      x-required-permission: external_sources:create&components:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_component_ids]
              properties:
                external_component_ids: { type: array, items: { type: integer } }
                parent_id: { type: integer, nullable: true }
                tag_ids: { type: array, items: { type: integer } }
      responses:
        "200":
          description: Nichts angelegt (alles übersprungen).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalImportResult" }
        "201":
          description: Mindestens eine Komponente angelegt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalImportResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
