  # ------------------------------------------------------------------
  # Webhooks
  # ------------------------------------------------------------------
  /api/webhooks/components/{component_id}/status:
    parameters:
      - $ref: "#/components/parameters/ComponentId"
    post:
      tags: [Webhooks]
      operationId: componentStatusWebhook
      summary: Komponentenstatus per Monitoring-Webhook setzen
      description: |
        Für Monitoring-Systeme (Uptime Kuma, Prometheus Alertmanager o. ä.).
        Authentifiziert sich mit dem Webhook-Token der Statusseite, zu der die
        Komponente gehört – bevorzugt im Header `X-Webhook-Token`, alternativ
        als Query `token` (landet dann in Proxy-Logs). Der Token wird
        konstant-zeitig verglichen. Eine unbekannte Komponenten-ID antwortet
        exakt wie ein falscher Token (`401 webhook_token_invalid`), damit sich
        IDs ohne Token nicht abtasten lassen.
      security:
        - webhookToken: []
        - webhookTokenQuery: []
      x-rate-limit: 20/min pro IP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/ComponentStatus" }
            example: { status: major_outage }
      responses:
        "200":
          description: Status gesetzt, geänderte Komponente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Component" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/webhooks/component-slugs/{slug}/status:
    parameters:
      - name: slug
        in: path
        required: true
        description: Kennung (Slug) der Komponente, aufgelöst nur innerhalb der Statusseite des Tokens.
        schema: { type: string }
    post:
      tags: [Webhooks]
      operationId: componentStatusWebhookBySlug
      summary: Komponentenstatus per Monitoring-Webhook über die Kennung setzen
      description: |
        Wie `componentStatusWebhook`, adressiert die Komponente aber über ihre
        Kennung. Die Statusseite kommt allein aus dem Webhook-Token;
        ein ungültiger Token ergibt immer `401`, auch bei unbekannter Kennung.
        Mit gültigem Token ergibt eine unbekannte oder gelöschte Kennung (oder
        die einer anderen Seite) `404`. Archivierte Komponenten bleiben
        ansprechbar, Gruppen ergeben `409`. Statushistorie und Audit-Log wie
        beim ID-Weg.
      security:
        - webhookToken: []
        - webhookTokenQuery: []
      x-rate-limit: 20/min pro IP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/ComponentStatus" }
            example: { status: major_outage }
      responses:
        "200":
          description: Status gesetzt, geänderte Komponente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Component" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Die Komponente ist eine Gruppe (`component_is_group`). }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ------------------------------------------------------------------
  # Subscriptions
  # ------------------------------------------------------------------
  /api/subscribe:
    post:
      tags: [Subscriptions]
      operationId: subscribe
      summary: Statusseite abonnieren (E-Mail oder Google Chat)
      description: |
        E-Mail-Abos sind zunächst `pending` und werden erst nach Klick auf den
        Bestätigungslink aktiv (Double-Opt-in, 24 h gültig). Ausnahme: Ist der
        Aufrufer angemeldet und abonniert die eigene Konto-E-Mail, ist das Abo
        sofort `active`. Die Antwort ist für neue und bereits aktiv abonnierte
        Adressen gleich (`200`, bei E-Mail `status: pending`); bei einer bereits
        abonnierten Adresse wird nichts geändert und keine Mail verschickt. Nur
        wer mit der eigenen Konto-Adresse angemeldet ist, bekommt `409`
        (`subscription_exists_email`). Adressen gelten je Postfach (Groß-/
        Kleinschreibung und `+tag` zählen nicht): Pro Postfach gehen seitenübergreifend
        höchstens drei Bestätigungsmails in 24 Stunden raus, darüber bleibt die
        Antwort gleich, es wird aber nichts angelegt oder verschickt.
        Google-Chat-Webhooks sind nur als `https://chat.googleapis.com/v1/spaces/…`
        (Port 443, ohne Zugangsdaten) erlaubt; jede andere URL ergibt
        `400 webhook_url_invalid`, ohne DNS-Auflösung. Eingaben sind begrenzt
        (E-Mail 254, `webhook_url` 2048, `component_ids` 8192, `language` 16,
        `slug` 100 Byte): zu lang ergibt `400 input_too_long`, Steuerzeichen
        (auch ein NUL-Byte) ergeben `400 input_invalid_characters`. Dieselben
        Grenzen gelten für Admin-Anlage, Admin-Änderung und `PUT /api/me/subscription`.
        Für private Seiten ist ein
        Login-Token mit Rolle auf der Seite nötig, sonst 404.
      security: *optionalBearer
      x-rate-limit: 10/min pro IP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscribeRequest" }
      responses:
        "200":
          description: Abo angelegt bzw. Bestätigungsmail (erneut) verschickt; für bereits abonnierte Adressen dieselbe Antwort.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscribeResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/subscribe/test-webhook:
    post:
      tags: [Subscriptions]
      operationId: testWebhook
      summary: Test-Nachricht an einen Google-Chat-Webhook senden
      x-required-permission: authenticated
      x-rate-limit: 10/min pro IP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [webhook_url]
              properties:
                webhook_url: { type: string, format: uri, description: "https-URL, keine internen Adressen." }
      responses:
        "200": { $ref: "#/components/responses/MessageOk" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429":
          description: |
            Entweder das eigene Rate-Limit dieses Endpunkts oder das
            Webhook-Ziel (z. B. Google Chat) drosselt (HTTP 429 des Ziels
            bzw. lokaler Limiter von 1 Nachricht/s je URL). Der Endpunkt
            wartet nie, sondern antwortet sofort. Bei einer Drosselung des
            Ziels lautet der Code `webhook_rate_limited` und `retry_after`
            nennt die Wartezeit in Sekunden.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code: { type: string, example: webhook_rate_limited }
                  retry_after: { type: integer, minimum: 1, description: "Sekunden bis zum nächsten Versuch (nur bei `webhook_rate_limited`)." }
        "502":
          description: |
            Das Webhook-Ziel hat die Nachricht nicht angenommen. Code
            `webhook_rejected`: Ziel antwortete mit 4xx außer 429 (URL oder
            Schlüssel falsch); Code `webhook_unreachable`: 5xx (z. B. 503
            bei Überlast), Netzfehler oder Timeout.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code: { type: string, enum: [webhook_rejected, webhook_unreachable] }
  /api/public/subscribers/confirm:
    post:
      tags: [Subscriptions]
      operationId: confirmSubscription
      summary: E-Mail-Abo bestätigen (Double-Opt-in)
      security: []
      x-rate-limit: 20/min pro IP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "200":
          description: Abo ist aktiv.
          content:
            application/json:
              schema:
                type: object
                required: [message, slug]
                properties:
                  message: { type: string }
                  slug: { type: string, description: Slug der abonnierten Seite. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "410": { $ref: "#/components/responses/Gone" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/public/subscribers/unsubscribe:
    get:
      tags: [Subscriptions]
      operationId: unsubscribeRedirect
      summary: Abbestell-Link aus der Mail auf die Frontend-Seite umleiten
      description: |
        Ohne Seiteneffekt (GET muss sicher sein, Link-Scanner von
        Mail-Gateways rufen ihn ebenfalls auf). Leitet auf
        `<FRONTEND_URL>/unsubscribe?token=…` weiter; dort bestätigt der
        Nutzer, und das Frontend ruft `POST` auf demselben Pfad auf.
      security: []
      x-rate-limit: 20/min pro IP
      parameters:
        - name: token
          in: query
          required: false
          description: Subscriber-Token, wird unverändert weitergereicht.
          schema: { type: string }
      responses:
        "303":
          description: Weiterleitung auf die Abbestell-Seite des Frontends.
          headers:
            Location: { $ref: "#/components/headers/Location" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      tags: [Subscriptions]
      operationId: unsubscribe
      summary: Abo beenden (auch RFC-8058-One-Click)
      description: |
        Löscht das Abo, zu dem der Subscriber-Token gehört. Der Token kommt
        als Query `?token=` (so ruft der Mail-Client bei RFC 8058 auf: die
        Mails tragen `List-Unsubscribe: <…/api/public/subscribers/unsubscribe?token=…>`
        und `List-Unsubscribe-Post: List-Unsubscribe=One-Click`, Body
        `List-Unsubscribe=One-Click` als Formular) oder im JSON-Body
        `{"token": "…"}`. Der Query-Parameter hat Vorrang.
      security:
        - subscriberToken: []
        - {}
      x-rate-limit: 20/min pro IP
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                List-Unsubscribe: { type: string, const: One-Click }
      responses:
        "200": { $ref: "#/components/responses/MessageOk" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ------------------------------------------------------------------
  # Orders
  # ------------------------------------------------------------------
  /api/public/orders/enabled:
    get:
      tags: [Orders]
      operationId: getPublicOrdersEnabled
      summary: Ist die Self-Service-Bestellung aktiv?
      description: |
        Meldet ohne Auth, ob die Self-Service-Bestellung global aktiviert ist.
        Landing-CTA und /order-Seite richten sich danach. Default (kein
        gespeicherter Wert): aktiviert.
      security: []
      x-rate-limit: 60/min pro IP
      responses:
        "200":
          description: Flag, ob die Bestellung aktiv ist.
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled: { type: boolean }
  /api/public/orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Neue Statusseite bestellen (Schritt 1/3)
      description: |
        Legt eine Bestellung an und schickt einen Bestätigungslink. Höchstens
        3 offene Bestellungen je Postfach (Groß-/Kleinschreibung und `+tag` im
        lokalen Teil zählen nicht als andere Adresse). Eingaben sind begrenzt:
        `company_name` höchstens 120 Zeichen (`order_name_too_long`), `slug` höchstens
        60 (`slug_too_long`), `email` höchstens 254 (`email_too_long`); NUL-Bytes
        und ungültiges UTF-8 ergeben 400 `invalid_characters`. Das Feld `website` ist ein Honeypot:
        ist es befüllt, kommt dieselbe Erfolgsantwort ohne jede Wirkung.
        Ist die Self-Service-Bestellung global deaktiviert,
        antwortet der Endpunkt mit 403.
      security: []
      x-rate-limit: 5/min pro IP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderCreate" }
      responses:
        "201": { $ref: "#/components/responses/MessageCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/public/orders/confirm:
    post:
      tags: [Orders]
      operationId: confirmOrder
      summary: Bestellung bestätigen, Seite und Konto anlegen (Schritt 2/3)
      security: []
      x-rate-limit: 20/min pro IP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "200":
          description: Seite angelegt; mit dem Token wird das Passwort gesetzt.
          content:
            application/json:
              schema:
                type: object
                required: [set_password_token, slug]
                properties:
                  set_password_token: { type: string }
                  slug: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/public/orders/set-password:
    post:
      tags: [Orders]
      operationId: setOrderPassword
      summary: Passwort für das neue Konto setzen (Schritt 3/3)
      security: []
      x-rate-limit: 10/min pro IP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8, format: password }
      responses:
        "200":
          description: Passwort gesetzt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlugResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ------------------------------------------------------------------
  # Me
  # ------------------------------------------------------------------
  /api/me:
    get:
      tags: [Me]
      operationId: getMe
      summary: Eigenes Profil
      x-required-permission: authenticated
      responses:
        "200":
          description: Profil.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Me]
      operationId: updateMe
      summary: Bevorzugte Sprache setzen
      x-required-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preferred_language]
              properties:
                preferred_language: { type: string, enum: [de, en] }
      responses:
        "200":
          description: Gespeichert.
          content:
            application/json:
              schema:
                type: object
                properties:
                  preferred_language: { type: string, enum: [de, en] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Me]
      operationId: deleteMe
      summary: Eigenes Konto löschen (DSGVO)
      description: |
        Verlangt Passwort (Passwort-Konten) bzw. `confirm_email` (SSO-Konten).
        Ist der Nutzer einziger Admin von Statusseiten, antwortet der Server
        mit 409 `sole_admin_pages` und der Seitenliste; diese Seiten werden
        nur mitgelöscht, wenn ihre IDs in `confirm_delete_page_ids` stehen.
        Der letzte Global Admin kann sich nicht löschen (409
        `last_global_admin`).
      x-required-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string, format: password }
                confirm_email: { type: string, format: email }
                confirm_delete_page_ids:
                  type: array
                  items: { type: integer }
      responses:
        "200":
          description: Konto gelöscht.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  deleted_pages:
                    type: array
                    items: { $ref: "#/components/schemas/PageRef" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Letzter Global Admin oder unbestätigte Seiten.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      code: { type: string, enum: [last_global_admin, sole_admin_pages] }
                      pages:
                        type: array
                        items: { $ref: "#/components/schemas/PageRef" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/me/export:
    get:
      tags: [Me]
      operationId: exportMe
      summary: Eigene Daten als JSON-Download (DSGVO)
      x-required-permission: authenticated
      responses:
        "200":
          description: 'Export (`Content-Disposition: attachment; filename="me-export.json"`).'
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: { $ref: "#/components/schemas/User" }
                  page_roles:
                    type: array
                    items:
                      type: object
                      properties:
                        status_page_id: { type: integer }
                        status_page_name: { type: string }
                        role_id: { type: integer }
                        role_name: { type: string }
                  subscriptions:
                    type: array
                    items: { $ref: "#/components/schemas/Subscriber" }
                  audit_logs:
                    type: array
                    items: { $ref: "#/components/schemas/AuditLog" }
                  invitations:
                    type: array
                    description: Offene Einladungen an die eigene Adresse, ohne Token und Einladenden.
                    items:
                      type: object
                      properties:
                        status_page_id: { type: integer }
                        status_page_name: { type: string }
                        role_id: { type: integer }
                        created_at: { type: string, format: date-time }
                        expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/me/pages:
    get:
      tags: [Me]
      operationId: listMyPages
      summary: Statusseiten, auf denen ich eine Rolle habe
      description: Global Admins erhalten alle Seiten mit `RoleName` „Global Admin“. Ein Token mit `sso_page_id` erhält höchstens diese Seite (und nie die Global-Admin-Liste).
      x-required-permission: authenticated
      responses:
        "200":
          description: Seiten mit Rolle.
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/StatusPage"
                    - type: object
                      properties:
                        Permissions: { type: string, description: Kommagetrennte Rechte der Rolle. }
                        RoleName: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/invitations/preview:
    post:
      tags: [Me]
      operationId: previewPageInvitation
      summary: Eigene Einladung ansehen
      description: Verbraucht den Token nicht. Unbekannter Token und Einladung an eine andere Adresse ergeben dieselbe 404.
      x-required-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: Einmal-Token aus der Einladungsmail. }
      responses:
        "200":
          description: Seite und Rolle.
          content:
            application/json:
              schema:
                type: object
                properties:
                  page_name: { type: string }
                  role_name: { type: string }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/invitations/accept:
    post:
      tags: [Me]
      operationId: acceptPageInvitation
      summary: Eigene Einladung annehmen
      description: |
        Einmalig. 409 `invitation_account_conflict` für Global-Admin-Konten, Konten mit
        SSO-Verknüpfung oder Rolle auf einer anderen Seite und Seiten-SSO-Sitzungen;
        409 `invitation_already_member`, wenn das Konto schon Mitglied ist.
      x-required-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: Einmal-Token aus der Einladungsmail. }
      responses:
        "200":
          description: Mitglied geworden.
          content:
            application/json:
              schema:
                type: object
                properties:
                  page_name: { type: string }
                  role_name: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/invitations/decline:
    post:
      tags: [Me]
      operationId: declinePageInvitation
      summary: Eigene Einladung ablehnen
      x-required-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: Einmal-Token aus der Einladungsmail. }
      responses:
        "200": { $ref: "#/components/responses/MessageOk" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/me/subscription:
    parameters:
      - name: slug
        in: query
        required: true
        description: Slug der Statusseite.
        schema: { type: string }
    get:
      tags: [Me]
      operationId: getMySubscription
      summary: Eigenes Abo einer Statusseite
      x-required-permission: authenticated
      responses:
        "200":
          description: Abo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MySubscription" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Me]
      operationId: updateMySubscription
      summary: Abonnierte Komponenten ändern
      x-required-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [component_ids]
              properties:
                component_ids: { $ref: "#/components/schemas/ComponentIdList" }
                language: { type: string, description: "Optional: Mailsprache ändern (leer = Seitenstandard); ohne Feld bleibt sie unverändert." }
      responses:
        "200": { $ref: "#/components/responses/MessageOk" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Me]
      operationId: deleteMySubscription
      summary: Eigenes Abo beenden
      x-required-permission: authenticated
      responses:
        "200": { $ref: "#/components/responses/MessageOk" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/me/sso:
    get:
      tags: [Me]
      operationId: listMySSO
      summary: Eigene SSO-Verknüpfungen und verknüpfbare Seiten
      x-required-permission: authenticated
      responses:
        "200":
          description: Verknüpfungen.
          content:
            application/json:
              schema:
                type: object
                properties:
                  identities:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        status_page_id: { type: integer }
                        page_name: { type: string }
                        protocol: { type: string, enum: [oidc, saml] }
                        email: { type: string }
                        created_at: { type: string, format: date-time }
                  linkable:
                    type: array
                    items:
                      type: object
                      properties:
                        status_page_id: { type: integer }
                        page_name: { type: string }
                        protocol: { type: string, enum: [oidc, saml] }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/me/sso/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      tags: [Me]
      operationId: deleteMySSO
      summary: SSO-Verknüpfung lösen
      x-required-permission: authenticated
      responses:
        "204": { description: Gelöst. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------------------------
  # Admin – Pages
  # ------------------------------------------------------------------
  /api/pages:
    get:
      tags: [Admin – Pages]
      operationId: listAllPages
      summary: Alle Statusseiten (auch private)
      x-required-permission: global-admin
      responses:
        "200":
          description: Seiten.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StatusPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/admin/pages:
    post:
      tags: [Admin – Pages]
      operationId: createPage
      summary: Statusseite anlegen
      description: >-
        Ohne Slug wird er aus dem Namen erzeugt. Erlaubt sind Kleinbuchstaben, Ziffern und einzelne
        Bindestriche; reservierte Namen (`www`, `staging`, `api`, `admin`, `app`, `mail`, `login`, `docs`,
        `status`, `order`, `auth`, `subscribe`, `unsubscribe`, `profile`, `healthz`, `static`, `assets`,
        `fonts`, `system`, `support`, `security`, `billing`, `postmaster`, `abuse`, `noreply`, `no-reply`, `info`, `root`,
        `hostmaster`, `webmaster`, `edge`) ergeben 400 mit `code: slug_reserved`, ein belegter Slug 409 mit `slug_taken`.
      x-required-permission: global-admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusPageWrite" }
      responses:
        "201":
          description: Angelegt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/admin/pages/{page_id}:
    parameters:
      - $ref: "#/components/parameters/PageId"
    put:
      tags: [Admin – Pages]
      operationId: updatePage
      summary: Statusseite ändern
      description: Custom Domain und Webhook-Token laufen über eigene Endpunkte.
      x-required-permission: pages:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusPageWrite" }
      responses:
        "200":
          description: Geändert.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Admin – Pages]
      operationId: deletePage
      summary: Statusseite löschen
      x-required-permission: pages:delete
      responses:
        "200": { $ref: "#/components/responses/MessageOk" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/admin/pages/{page_id}/users:
    parameters:
      - $ref: "#/components/parameters/PageId"
    get:
      tags: [Admin – Pages]
      operationId: listPageUsers
      summary: Nutzer mit Rolle auf der Seite
      x-required-permission: pages:read
      responses:
        "200":
          description: Rollen-Zuordnungen (mit `User` und `Role`).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserStatusPageRole" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin – Pages]
      operationId: addPageUser
      summary: Nutzer eine Rolle auf der Seite geben, ändern oder einladen
      description: |
        Global Admins ordnen per `user_id` oder `email` direkt zu. Alle anderen ändern
        per `user_id` nur die Rolle bestehender Mitglieder; per `email` entsteht für
        jede Adresse, die noch kein Mitglied ist, eine Einladung. Die
        Antwort ist dann immer dieselbe neutrale 200, gleich ob ein Konto existiert;
        nur ein vorhandenes Konto bekommt die Einladungsmail. Eine offene Einladung
        derselben Adresse, die jünger als 30 Minuten ist oder eine Rolle trägt, die der
        Aufrufer nicht abdeckt, bleibt unverändert (keine neue Mail). Die 30-Minuten-Sperre
        gilt je Seite und Adresse und überdauert Zurückziehen und Ablehnen. Höchstens 100 offene
        und 200 neue Einladungen je Seite und Tag (429 `invitation_limit_reached`).
      x-required-permission: pages:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_id]
              properties:
                user_id: { type: integer }
                email: { type: string, format: email }
                role_id: { type: integer }
      responses:
        "200":
          description: Bestehende Rolle geändert bzw. (per E-Mail) neutrale Bestätigung `{message}`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserStatusPageRole" }
        "201":
          description: Rolle zugewiesen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserStatusPageRole" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/admin/pages/{page_id}/users/{uid}:
    parameters:
      - $ref: "#/components/parameters/PageId"
      - name: uid
        in: path
        required: true
        description: Nutzer-ID.
        schema: { type: integer, minimum: 1 }
    delete:
      tags: [Admin – Pages]
      operationId: removePageUser
      summary: Rolle eines Nutzers auf der Seite entfernen
      x-required-permission: pages:delete
      responses:
        "200": { $ref: "#/components/responses/MessageOk" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/pages/{page_id}/invitations:
    parameters:
      - $ref: "#/components/parameters/PageId"
    get:
      tags: [Admin – Pages]
      operationId: listPageInvitations
      summary: Offene Einladungen der Seite
      description: Nur gültige Einladungen, ohne Token.
      x-required-permission: pages:read
      responses:
        "200":
          description: Offene Einladungen.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    ID: { type: integer }
                    Email: { type: string }
                    RoleID: { type: integer }
                    RoleName: { type: string }
                    ExpiresAt: { type: string, format: date-time }
                    CreatedAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/admin/pages/{page_id}/invitations/{id}:
    parameters:
      - $ref: "#/components/parameters/PageId"
      - name: id
        in: path
        required: true
        description: Einladungs-ID.
        schema: { type: integer, minimum: 1 }
    delete:
      tags: [Admin – Pages]
      operationId: revokePageInvitation
      summary: Einladung zurückziehen
      x-required-permission: pages:delete
      responses:
        "200": { $ref: "#/components/responses/MessageOk" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/admin/pages/{page_id}/webhook-token:
    parameters:
      - $ref: "#/components/parameters/PageId"
    post:
      tags: [Webhooks]
      operationId: generateWebhookToken
      summary: Webhook-Token erzeugen (ersetzt einen bestehenden)
      description: |
        Der Token (64 Hex-Zeichen) wird nur in dieser Antwort im Klartext geliefert. Gespeichert wird
        nur sein SHA-256-Hash; ein verlorener Token lässt sich nicht erneut anzeigen und muss neu
        erzeugt werden.
      x-required-permission: pages:update
      responses:
        "200":
          description: Neuer Token.
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string, pattern: "^[0-9a-f]{64}$" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Webhooks]
      operationId: revokeWebhookToken
      summary: Webhook-Token widerrufen
      x-required-permission: pages:update
      responses:
        "200": { $ref: "#/components/responses/MessageOk" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/admin/pages/{page_id}/custom-domain:
    parameters:
      - $ref: "#/components/parameters/PageId"
    put:
      tags: [Admin – Pages]
      operationId: setCustomDomain
      summary: Custom Domain setzen (Status wird `pending`)
      x-required-permission: pages:update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domain: { type: string, description: Leer entfernt die Domain. }
      responses:
        "200":
          description: Gespeichert, mit DNS-Anweisungen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomDomainState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Admin – Pages]
      operationId: deleteCustomDomain
      summary: Custom Domain entfernen
      x-required-permission: pages:update
      responses:
        "200": { $ref: "#/components/responses/MessageOk" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/admin/pages/{page_id}/custom-domain/verify:
    parameters:
      - $ref: "#/components/parameters/PageId"
    post:
      tags: [Admin – Pages]
      operationId: verifyCustomDomain
      summary: TXT-Eintrag der Custom Domain prüfen
      description: >-
        Fragt per DNS den TXT-Eintrag der Domain ab. Je Seite und je Nutzer
        sind höchstens 10 Prüfungen pro Minute möglich, darüber antwortet der
        Server mit `429` und `rate_limited`.
      x-required-permission: pages:update
      x-rate-limit: 10/min je Seite und je Nutzer
      responses:
        "200":
          description: Ergebnis der Prüfung (auch bei nicht gefundenem Eintrag 200 mit `verified=false`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CustomDomainState"
                  - type: object
                    properties:
                      verified: { type: boolean }
                      message: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            Nichts wurde gespeichert. `code` = `custom_domain_changed`: Domain oder Verifikations-Token wurden
            während des DNS-Lookups geändert oder entfernt, erneut prüfen. `code` = `domain_taken`: Eine andere
            Statusseite trägt die Domain bereits verifiziert oder aktiv, auch wenn sie gleichzeitig verifiziert wurde.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/admin/pages/{page_id}/sso:
    parameters:
      - $ref: "#/components/parameters/PageId"
    get:
      tags: [Admin – Pages]
      operationId: getPageSSO
      summary: SSO-Konfiguration der Seite (OIDC und SAML)
      description: Das OIDC-Client-Secret und der SAML-SP-Schlüssel werden nie geliefert (nur `oidc_client_secret_set` bzw. das öffentliche `saml_sp_certificate`).
      x-required-permission: sso:read
      responses:
        "200":
          description: Konfiguration (Standardwerte, falls noch keine existiert).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSOConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Admin – Pages]
      operationId: updatePageSSO
      summary: SSO-Konfiguration speichern (OIDC und SAML)
      description: Leeres `oidc_client_secret` behält das gespeicherte Secret. Beim ersten Speichern entstehen SAML-SP-Schlüssel und -Zertifikat. Ungültige SAML-Angaben (URL und XML zugleich, http-URL, unlesbares XML, aktiv ohne Metadaten) ergeben 400. Wechselt der OIDC-Issuer bzw. die Quelle der SAML-Metadaten oder Entity-ID/Signaturzertifikat des IdP, werden die Verknüpfungen der Seite für dieses Protokoll gelöscht (Audit `sso.oidc_identities_reset` bzw. `sso.saml_identities_reset`). Anfragen über 256 KB ergeben 413, `saml_idp_metadata_xml` über 128 KB 400.
      x-required-permission: sso:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SSOConfigWrite" }
      responses:
        "200":
          description: Gespeichert.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSOConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { description: Anfrage größer als 256 KB. }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Admin – Pages]
      operationId: deletePageSSO
      summary: SSO-Konfiguration löschen
      x-required-permission: sso:delete
      responses:
        "200": { $ref: "#/components/responses/MessageOk" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/admin/pages/{page_id}/sso/saml-test:
    parameters:
      - $ref: "#/components/parameters/PageId"
    post:
      tags: [Admin – Pages]
      operationId: startPageSAMLTest
      summary: SAML-Testanmeldung gegen den IdP starten
      description: |
        Nur mit `test_login_enabled` (sonst 403 `test_disabled`) und
        hinterlegten IdP-Metadaten (sonst 400 `saml_test_incomplete`); SAML
        muss dafür noch nicht aktiv sein. Liefert die IdP-URL; das Ergebnis
        landet ohne Sitzung auf der SSO-Seite des Admin-Bereichs.
      x-required-permission: sso:update
      x-rate-limit: 20/min pro IP
      responses:
        "200":
          description: URL zum IdP.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UrlResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /api/admin/pages/{page_id}/sso/test:
    parameters:
      - $ref: "#/components/parameters/PageId"
    post:
      tags: [Admin – Pages]
      operationId: startPageSSOTest
      summary: Testanmeldung gegen den IdP starten
      description: Nur mit `test_login_enabled`. Liefert die Authorize-URL; das Ergebnis landet ohne Sitzung auf der SSO-Seite des Admin-Bereichs.
      x-required-permission: sso:update
      x-rate-limit: 20/min pro IP
      responses:
        "200":
          description: Authorize-URL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UrlResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }

  # ------------------------------------------------------------------
  # Admin – Content
  # ------------------------------------------------------------------
  /api/pages/{page_id}/components/{id}:
    parameters:
      - $ref: "#/components/parameters/PageId"
      - $ref: "#/components/parameters/Id"
    put:
      tags: [Admin – Content]
      operationId: updateComponent
      summary: Komponente ändern
      x-required-permission: components:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComponentUpdate" }
      responses:
        "200":
          description: Geändert.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Component" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Admin – Content]
      operationId: deleteComponent
      summary: Komponente löschen
      x-required-permission: components:delete
      responses:
        "200": { $ref: "#/components/responses/MessageOk" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/pages/{page_id}/components/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/PageId"
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Admin – Content]
      operationId: archiveComponent
      summary: Komponente archivieren
      description: >-
        Archiviert die Komponente samt Mitgliedern (Gruppe). Wiederholtes Archivieren ändert
        nichts. Verlauf, Verfügbarkeit und Vorfall-Zuordnungen bleiben erhalten.
      x-required-permission: components:update
      responses:
        "200":
          description: Archiviert.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Component" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/pages/{page_id}/components/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/PageId"
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Admin – Content]
      operationId: restoreComponent
      summary: Komponente wiederherstellen
      description: >-
        Stellt eine archivierte Komponente wieder her (bei einer Gruppe die mit ihr archivierten
        Mitglieder). Liegt sie in einer archivierten Gruppe, antwortet die API mit 409 `parent_archived`.
      x-required-permission: components:update
      responses:
        "200":
          description: Wiederhergestellt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Component" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/pages/{page_id}/incidents/{id}/updates:
    parameters:
      - $ref: "#/components/parameters/PageId"
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Admin – Content]
      operationId: addIncidentUpdate
      summary: Verlaufseintrag zu einem Vorfall hinzufügen
      description: Setzt Status und Nachricht des Vorfalls und benachrichtigt.
      x-rate-limit: 120/Stunde je Seite und je Nutzer (`429 rate_limited`)
      x-required-permission: incidents:create|maintenance:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, message]
              properties:
                status: { $ref: "#/components/schemas/IncidentStatus" }
                message: { $ref: "#/components/schemas/RichTextMessage" }
      responses:
        "201":
          description: Eintrag angelegt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentUpdate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/pages/{page_id}/incidents/{id}/updates/{update_id}/translations:
    parameters:
      - $ref: "#/components/parameters/PageId"
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/UpdateId"
    get:
      tags: [Admin – Translations]
      operationId: getIncidentUpdateTranslations
      summary: Übersetzungen eines Vorfall-Updates laden (inklusive Entwürfe)
      description: >-
        Alle gespeicherten Übersetzungen der Nachricht eines Updates,
        auch Entwürfe, nach Sprache sortiert. Unbekanntes Update oder Update eines
        anderen Vorfalls: 404 `update_not_found`.
      x-required-permission: incidents:read|maintenance:read
      responses:
        "200":
          description: Übersetzungen.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IncidentUpdateTranslation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/pages/{page_id}/incidents/{id}/updates/{update_id}/translations/{language_code}:
    parameters:
      - $ref: "#/components/parameters/PageId"
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/UpdateId"
      - name: language_code
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [Admin – Translations]
      operationId: saveIncidentUpdateTranslation
      summary: Übersetzung eines Vorfall-Updates für eine Sprache speichern
      description: >-
        Legt die Übersetzung der Update-Nachricht an oder ändert sie.
        Ein Update hat keinen Titel. `status` ist `draft` (in Arbeit) oder
        `confirmed` (fertig, öffentlich sichtbar). Nur weitere aktive Sprachen der
        Seite sind erlaubt, die Standardsprache ist das Update selbst (sonst 400
        `language_not_available`). Wird das Update gelöscht, verschwinden seine
        Übersetzungen.
      x-required-permission: incidents:update|maintenance:update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, status]
              properties:
                message: { $ref: "#/components/schemas/RichTextMessage" }
                status: { type: string, enum: [draft, confirmed] }
      responses:
        "200":
          description: Gespeichert.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentUpdateTranslation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/pages/{page_id}/incidents/{id}/postmortem:
    parameters:
      - $ref: "#/components/parameters/PageId"
      - $ref: "#/components/parameters/Id"
    put:
      tags: [Admin – Content]
      operationId: upsertPostMortem
      summary: Post-Mortem anlegen/ändern (optional veröffentlichen)
      description: Die Maßnahmenliste wird vollständig ersetzt.
