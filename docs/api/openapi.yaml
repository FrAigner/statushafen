        angemeldeten Benutzers. Gleiche Meldungen sind zusammengefasst (`count`). Die Texte stehen nicht im
        Backend, sondern als i18n-Schlüssel (`title_key`, `body_key`) mit `params`; Webhook-URLs, Schlüssel und
        Adressen von Abonnenten sind nie enthalten. Aufbewahrung 90 Tage.
      x-required-permission: external_sources:update|subscribers:update
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: unread, in: query, required: false, description: "1 = nur ungelesene, nicht erledigte", schema: { type: string, enum: ["1", "true"] } }
      responses:
        "200":
          description: Nachrichten.
          content:
