        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/pages/{page_id}/external-sources:
    parameters:
      - $ref: "#/components/parameters/PageId"
    get:
      tags: [Admin – Content]
      operationId: listExternalSources
      summary: Externe Statusseiten (Quellen) der Seite
      description: "eingebundene Fremd-Statusseiten (z. B. eine öffentliche Statusseite) mit Abrufstatus und Zählern."
      x-required-permission: external_sources:read
      responses:
        "200":
          description: Quellen, nach Name sortiert.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExternalSource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Admin – Content]
      operationId: createExternalSource
      summary: Externe Statusseite einbinden
      description: >-
        `base_url` muss https auf Port 443 sein, ohne Zugangsdaten, Query oder Fragment; sie wird
        normalisiert (Kleinschreibung, ohne `/` am Ende). Die Ziel-IP prüft der Server bei jedem Abruf
        nach der DNS-Auflösung (keine internen Adressen, auch nicht über Redirects).
      x-required-permission: external_sources:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ExternalSourceWrite"
                - required: [name, base_url]
      responses:
        "201":
          description: Angelegt (aktiv, ohne Abruf; der erste Abruf folgt im nächsten Takt oder per `fetch`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalSource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/pages/{page_id}/external-sources/{id}:
    parameters:
      - $ref: "#/components/parameters/PageId"
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Admin – Content]
      operationId: getExternalSource
      summary: Externe Statusseite lesen
      x-required-permission: external_sources:read
      responses:
        "200":
          description: Quelle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalSource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Admin – Content]
      operationId: updateExternalSource
      summary: Externe Statusseite ändern
      description: Nur gesendete Felder ändern sich. Eine neue `base_url` verwirft die gespeicherten Validatoren (ETag/Last-Modified).
      x-required-permission: external_sources:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExternalSourceWrite" }
      responses:
        "200":
          description: Geändert.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalSource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Admin – Content]
      operationId: deleteExternalSource
      summary: Externe Statusseite entfernen
      description: >-
        Löscht (soft) die Quelle, ihre externen Komponenten und alle Kopplungen daran. Hat der Nutzer
        auf eine verknüpfte Komponente keinen Tag-Zugriff, antwortet der Endpunkt mit 403 `forbidden`
        und löscht nichts (Global Admins und Nutzer ohne Tags sind nicht eingeschränkt).
      x-required-permission: external_sources:delete
      responses:
        "200": { $ref: "#/components/responses/MessageOk" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/pages/{page_id}/external-sources/{id}/fetch:
    parameters:
      - $ref: "#/components/parameters/PageId"
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Admin – Content]
      operationId: fetchExternalSource
      summary: Externe Statusseite jetzt abrufen
      description: >-
        Testabruf, auch für inaktive Quellen. Ein Fehler der Fremdseite (HTTP-Status, Timeout,
        gesperrtes Ziel) ist ein Ergebnis mit `ok: false`, kein 5xx. Pro Quelle läuft höchstens
        ein Abruf (Sperre im Prozess und per Postgres-Advisory-Lock über Instanzen hinweg). Läuft gerade
        einer (Hintergrund-Takt oder anderer Klick), antwortet der Endpunkt sofort mit
        `result: {ok: false, error: "fetch_in_progress"}`, ohne zu warten.
      x-required-permission: external_sources:update
      x-rate-limit: 20/min pro IP
      responses:
        "200":
          description: Ergebnis und aktualisierte Quelle.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { $ref: "#/components/schemas/ExternalFetchResult" }
                  source: { $ref: "#/components/schemas/ExternalSource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/pages/{page_id}/external-sources/{id}/components:
    parameters:
      - $ref: "#/components/parameters/PageId"
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Admin – Content]
      operationId: listExternalComponents
      summary: Externe Komponenten einer Quelle (Suche/Filter)
      x-required-permission: external_sources:read
      parameters:
        - { name: q, in: query, required: false, description: Teilstring in Name oder Gruppenname (ohne Groß-/Kleinschreibung)., schema: { type: string } }
        - { name: group, in: query, required: false, description: Externe Gruppen-ID; liefert die Gruppe und ihre Kinder., schema: { type: string } }
        - { name: status, in: query, required: false, description: Normalisierter Status., schema: { $ref: "#/components/schemas/ExternalComponentStatus" } }
        - { name: include_vanished, in: query, required: false, description: "`true` zeigt auch verschwundene Komponenten.", schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Gruppen und alle Treffer (Gruppen inklusive), sortiert nach Gruppe, Position, Name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items: { $ref: "#/components/schemas/ExternalComponent" }
                  components:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/ExternalComponent"
                        - type: object
                          properties:
                            linked_component_ids:
                              type: array
                              items: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/pages/{page_id}/external-outages:
    parameters:
      - $ref: "#/components/parameters/PageId"
    get:
      tags: [Admin – Content]
      operationId: listExternalOutages
      summary: Aktive Ausfälle externer Quellen der Seite
      description: >-
        Quellen (nur aktive), die als ausgefallen gelten, also seit
        `outage_after_minutes` keinen erfolgreichen Abruf mehr hatten. Für das Admin-Banner.
        Älteste zuerst; leer, wenn alles läuft.
      x-required-permission: external_sources:read
      responses:
        "200":
          description: Aktive Ausfälle.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExternalOutage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/pages/{page_id}/admin-notifications:
    parameters:
