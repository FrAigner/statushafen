security:
  - authToken: []
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Login-Token (HS256, 2 h) aus `POST /api/login` oder `POST /api/auth/sso-exchange` als `Authorization: Bearer`. Nach einem Seiten-SSO-Login mit Claim `sso_page_id` (nur diese Seite, nie Global Admin). Bevorzugt wird `authToken` (`X-Auth-Token`)."
    authToken:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: "Login-Token (HS256, 2 h) aus `POST /api/login` oder `POST /api/auth/sso-exchange`, ohne Präfix. Hat Vorrang vor `Authorization`. Nach einem Seiten-SSO-Login mit Claim `sso_page_id` (nur diese Seite, nie Global Admin)."
    webhookToken:
      type: apiKey
      in: header
      name: X-Webhook-Token
      description: Webhook-Token der Statusseite.
    webhookTokenQuery:
      type: apiKey
      in: query
      name: token
      description: Webhook-Token als Query-Parameter (Fallback, erscheint in Logs).
    subscriberToken:
      type: apiKey
      in: query
      name: token
      description: Signierter Subscriber-Token aus Benachrichtigungsmails.
    metricsBasicAuth:
      type: http
      scheme: basic
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Gemeinsames Secret `CADDY_INTERNAL_TOKEN`.

  headers:
    Location:
      description: Weiterleitungsziel.
      schema: { type: string, format: uri }
    RetryAfter:
      description: Sekunden bis zum nächsten Versuch.
      schema: { type: integer, const: 60 }

  parameters:
    PageId:
      name: page_id
      in: path
      required: true
      description: ID der Statusseite.
      schema: { type: integer, minimum: 1 }
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Slug:
      name: slug
      in: path
      required: true
      description: Slug der Statusseite.
      schema: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
    IncidentId:
      name: incident_id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    UpdateId:
      name: update_id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ComponentId:
      name: component_id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    NoticeId:
      name: notice_id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    TranslationId:
      name: translation_id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    OAuthProvider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [google, github] }
    LanguageCodeQuery:
      name: language_code
      in: query
      required: true
      schema: { type: string }
      example: de

  responses:
    MessageOk:
      description: Erfolg.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
    MessageCreated:
      description: Angelegt.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
    UiOverrideDeleted:
      description: Entfernt.
      content:
        application/json:
          schema:
            type: object
            properties:
              key: { type: string }
              language_code: { type: string }
    BadRequest:
      description: Ungültige Parameter oder ungültiger Request-Body.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: Invalid request fields }
    Unauthorized:
      description: Kein oder ungültiger Token bzw. falsche Zugangsdaten.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: Invalid or expired token }
    Forbidden:
      description: Angemeldet, aber ohne die nötige Berechtigung (oder private Seite ohne Zugriff). Auch bei einem Token mit `sso_page_id` für eine andere Seite oder eine `global-admin`-Route.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Access denied: Missing required permission: incidents:update" }
    NotFound:
      description: Ressource nicht gefunden.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Konflikt mit bestehendem Datensatz (z. B. Slug, E-Mail oder Abo bereits vorhanden).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Gone:
      description: Link/Token abgelaufen.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate-Limit überschritten.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: Zu viele Anfragen. Bitte später erneut versuchen. }
    BadGateway:
      description: Identity Provider nicht erreichbar.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Serverfehler (meist Datenbank).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    RichTextMessage:
      type: string
      maxLength: 5000
      description: |
        Nachricht bzw. Beschreibung als eingeschränktes Markdown,
        höchstens 5000 Zeichen (sonst `400` mit `code` `message_too_long`).
        Gespeichert und geliefert wird der Markdown-Quelltext; Altdaten (reiner
        Text) bleiben gültig, einfache Zeilenumbrüche bleiben erhalten. Erlaubt
        sind fett (`**x**`), kursiv (`*x*`), Listen (`- ` und `1. `), Absätze,
        Zitate, Code und Links mit `https:`. Überschriften, Bilder, Tabellen
        und Roh-HTML werden nicht dargestellt, sondern als Text angezeigt.
        Clients müssen den Text vor der Anzeige selbst bereinigen.
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: Menschenlesbare Fehlermeldung (kann sich ändern). }
        code:
          type: string
          description: Maschinenlesbarer, stabiler Fehlercode (z. B. `invalid_request`, `forbidden`, `slug_taken`, `slug_reserved`, `password_too_short`, `password_too_long`, `language_code_invalid`, `group_not_empty`, `server_error`). Fehlt bei älteren Antworten.
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }
    UrlResponse:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
    SlugResponse:
      type: object
      required: [slug]
      properties:
        slug: { type: string }
    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, description: Token aus dem Link der E-Mail. }
    NullableDateTime:
      type: [string, "null"]
      format: date-time
    GormModel:
      description: Gemeinsame Felder aller Models mit `gorm.Model` (Go-Feldnamen).
      type: object
      properties:
        ID: { type: integer }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
        DeletedAt: { $ref: "#/components/schemas/NullableDateTime" }
    PageRef:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }

    # --- Statusseite ---
    PublicStatusPage:
      description: Öffentliche Sicht einer Statusseite, ohne interne Konfiguration (Auto-Join, Absender, Custom-Domain-Status).
      type: object
      required: [ID, Name, Slug]
      properties:
        ID: { type: integer }
        Name: { type: string }
        Slug: { type: string }
        Description: { type: string }
        LogoURL: { type: string }
        PrimaryColor: { type: string, examples: ["#4c6ef5"] }
        SecondaryColor: { type: string, examples: ["#5e6c84"] }
        HeaderStyle: { type: string, enum: ["", classic, centered, minimal] }
        PageLayout: { type: string, enum: [standard, liste] }
    StatusPage:
      allOf:
        - $ref: "#/components/schemas/GormModel"
        - type: object
          properties:
            Name: { type: string }
            Slug: { type: string }
            Description: { type: string }
            LogoURL: { type: string }
            CustomDomain: { type: string }
            IsPublicIndexed: { type: boolean }
            IsPrivate: { type: boolean }
            DefaultRoleID: { type: [integer, "null"], description: Rolle für Auto-Join auf privaten Seiten. }
            AutoJoinEmailDomains: { type: string, description: Kommagetrennte E-Mail-Domains für Auto-Join. }
            PrimaryColor: { type: string, examples: ["#4c6ef5"] }
            SecondaryColor: { type: string, examples: ["#5e6c84"] }
            HeaderStyle: { type: string, enum: [classic, centered, minimal] }
            PageLayout: { type: string, enum: [standard, liste] }
            CustomDomainStatus: { type: string, enum: ["", pending, check_failed, verified, active], description: "`pending` = noch nicht geprüft, `check_failed` = letzte DNS-Prüfung fehlgeschlagen (siehe CustomDomainCheckedAt/CustomDomainCheckError). Eine fehlgeschlagene Prüfung ändert `verified`/`active` nie; dort stehen nur CheckedAt/CheckError." }
            CustomDomainVerifiedAt: { $ref: "#/components/schemas/NullableDateTime" }
            CustomDomainCheckedAt: { $ref: "#/components/schemas/NullableDateTime" }
            CustomDomainCheckError: { type: string, enum: ["", txt_not_found, dns_lookup_failed], description: Grund der letzten fehlgeschlagenen DNS-Prüfung; leer bei Erfolg oder ohne Prüfung. }
            NotificationFromAddress: { type: string, description: "Antwortadresse (Reply-To) der Mails dieser Seite. Die Absenderadresse ist immer die des Servers (SMTP_FROM), der Seitenname dient als Anzeigename." }
    StatusPageWrite:
      type: object
      properties:
        Name: { type: string }
        Slug: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
        Description: { type: string }
        LogoURL: { type: string }
        IsPublicIndexed: { type: boolean, description: Wird bei privaten Seiten immer false. }
        IsPrivate: { type: boolean }
        DefaultRoleID: { type: [integer, "null"] }
        AutoJoinEmailDomains: { type: string }
        PrimaryColor: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        SecondaryColor: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        HeaderStyle: { type: string, enum: ["", classic, centered, minimal] }
        PageLayout: { type: string, enum: [standard, liste], description: "Fehlt das Feld, bleibt der bisherige Wert." }
        NotificationFromAddress: { type: string, description: "Antwortadresse (Reply-To) der Mails dieser Seite, optional." }
    CustomDomainState:
      type: object
      properties:
        custom_domain: { type: string }
        custom_domain_status: { type: string, enum: ["", pending, check_failed, verified, active] }
        custom_domain_checked_at: { $ref: "#/components/schemas/NullableDateTime" }
        custom_domain_check_error: { type: string, enum: ["", txt_not_found, dns_lookup_failed] }
        cname_target: { type: string }
        verification_token: { type: string }
        txt_record_value: { type: string, description: Wert des anzulegenden TXT-Eintrags. }
    SSOConfig:
      type: object
      properties:
        status_page_id: { type: integer }
        oidc_enabled: { type: boolean }
        oidc_discovery_url: { type: string }
        oidc_client_id: { type: string }
        oidc_scopes: { type: string, default: openid email profile }
        oidc_attribute_email: { type: string, default: email }
        oidc_attribute_name: { type: string, default: name }
        oidc_attribute_role: { type: string }
        oidc_acs_url: { type: string, description: Beim IdP einzutragende Redirect-URI. }
        test_login_enabled: { type: boolean }
        oidc_client_secret_set: { type: boolean }
        saml_enabled: { type: boolean }
        saml_idp_metadata_url: { type: string }
        saml_idp_metadata_xml: { type: string }
        saml_attribute_email: { type: string, default: email }
        saml_attribute_name: { type: string, default: name }
        saml_allow_unspecified_nameid: { type: boolean, default: false, description: "NameID-Format unspecified zulassen (sonst nur persistent)." }
        saml_sp_certificate: { type: string, description: "SP-Zertifikat (PEM), öffentlich; der Schlüssel wird nie geliefert." }
        saml_entity_id: { type: string, description: SP-Entity-ID (= Metadaten-URL). }
        saml_metadata_url: { type: string }
        saml_acs_url: { type: string }
    SSOConfigWrite:
      type: object
      properties:
        oidc_enabled: { type: boolean }
        oidc_discovery_url: { type: string, format: uri }
        oidc_client_id: { type: string }
        oidc_client_secret: { type: string, writeOnly: true }
        oidc_scopes: { type: string }
        oidc_attribute_email: { type: string }
        oidc_attribute_name: { type: string }
        oidc_attribute_role: { type: string }
        test_login_enabled: { type: boolean }
        saml_enabled: { type: boolean, description: Verlangt IdP-Metadaten (URL oder XML). }
        saml_idp_metadata_url: { type: string, format: uri, description: "Nur https; nicht zusammen mit saml_idp_metadata_xml." }
        saml_idp_metadata_xml: { type: string, description: Wird beim Speichern geprüft. }
        saml_attribute_email: { type: string, description: "Leer = email." }
        saml_attribute_name: { type: string, description: "Leer = name." }
        saml_allow_unspecified_nameid: { type: boolean, description: "Standard false: nur persistente NameIDs; emailAddress wird immer abgelehnt." }

    # --- Komponenten ---
    ComponentStatus:
      type: string
      enum: [operational, degraded_performance, partial_outage, major_outage, under_maintenance]
    Component:
      allOf:
        - $ref: "#/components/schemas/GormModel"
        - type: object
          properties:
            StatusPageID: { type: integer }
            ParentID: { type: [integer, "null"] }
            Parent: { type: "null", description: Wird nicht befüllt (immer null). }
            Children:
              type: [array, "null"]
              items: { $ref: "#/components/schemas/Component" }
            Tags:
              type: [array, "null"]
              items: { $ref: "#/components/schemas/Tag" }
            Name: { type: string, maxLength: 60, description: "Neu/geändert höchstens 60 Zeichen; ältere Werte können länger sein." }
            Slug:
              type: string
              maxLength: 60
              pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
              description: >-
                Kennung der Komponente bzw. Gruppe, je Statusseite unter aktiven Komponenten eindeutig,
                nach dem Anlegen unveränderlich. Dient Integrationen als stabiler Schlüssel (Webhooks bleiben
                vorerst per ID adressiert).
            Description: { type: string, maxLength: 240, description: "Neu/geändert höchstens 240 Zeichen; ältere Werte können länger sein." }
            Visible:
              type: boolean
              description: >-
                false blendet die Komponente (bei einer Gruppe samt Mitgliedern) auf der öffentlichen
                Statusseite, in der Verfügbarkeit und im Abonnement-Assistenten aus. Anonyme und Leser ohne
                Komponenten-/Vorfallrecht bekommen unsichtbare Komponenten auch aus `listComponents` nicht.
            ArchivedAt:
              type: [string, "null"]
              format: date-time
              description: >-
                Zeitpunkt der Archivierung, sonst null. Archivierte Komponenten sind öffentlich wie
                unsichtbare ausgeblendet; Verlauf und Verfügbarkeit bleiben erhalten.
            Status:
              description: Komponentenstatus oder `group` für reine Gruppen-Knoten.
              anyOf:
                - $ref: "#/components/schemas/ComponentStatus"
                - { type: string, const: group }
            SortOrder: { type: integer }
            effective_status:
              description: >-
                nur in Komponentenbaum und Dashboard: schlimmster Status aus eigenem Status,
                offenen Vorfällen und gekoppelten externen Komponenten (aktive Quellen, nicht verschwunden).
                Rangfolge major_outage > partial_outage > degraded_performance > under_maintenance > operational;
                `unknown` zählt nicht. Gruppen aggregieren ihre Kinder.
              anyOf:
                - $ref: "#/components/schemas/ComponentStatus"
                - { type: string, const: group }
            external_sources:
              description: Nur in Komponentenbaum und Dashboard; fehlt ohne Kopplung.
              type: array
              items: { $ref: "#/components/schemas/ExternalStatusRef" }
    ExternalComponentStatus:
      description: Normalisierter Status einer externen Komponente; `unknown` für unbekannte Werte der Fremdseite.
      anyOf:
        - $ref: "#/components/schemas/ComponentStatus"
        - { type: string, const: unknown }
    ExternalStatusRef:
      type: object
      properties:
        external_component_id: { type: integer }
        source_id: { type: integer }
        source_name: { type: string }
        name: { type: string }
        group_name: { type: string }
        status: { $ref: "#/components/schemas/ExternalComponentStatus" }
        url: { type: string, description: "Link-Ziel (https) zur Fremdseite." }
        vanished: { type: boolean, description: Im letzten Abruf nicht mehr enthalten; zählt nicht. }
        is_group:
          type: boolean
          description: >-
            Die Kopplung zeigt auf eine ganze externe Gruppe. `name` und `group_name` sind dann
            der Gruppenname, `status` das Schlimmste ihrer aktuellen Mitglieder (`unknown` bei leerer Gruppe).
        worst:
          description: Nur bei Gruppen mit bewertbaren Mitgliedern - der Baustein, der den schlechtesten Status liefert.
          type: object
          properties:
            name: { type: string }
            status: { $ref: "#/components/schemas/ExternalComponentStatus" }
        source_outage:
          type: boolean
          description: >-
            Die Quelle ist ausgefallen. `status` ist der zuletzt bekannte, zählt aber nicht mehr
            in den effektiven Status (gilt als `unknown`), bis wieder ein Abruf gelingt.
    ExternalSourceWrite:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        base_url: { type: string, examples: ["https://status.example.com"] }
        provider: { type: string, enum: [summaryv2], default: summaryv2 }
        poll_interval_seconds: { type: integer, minimum: 60, maximum: 86400, default: 120 }
        outage_after_minutes:
          type: integer
          minimum: 10
          maximum: 1440
          default: 60
          description: Minuten ohne erfolgreichen Abruf (304 zählt als Erfolg) bis zur Ausfall-Meldung.
        active: { type: boolean, default: true }
    ExternalSource:
      allOf:
        - $ref: "#/components/schemas/GormModel"
        - type: object
          properties:
            status_page_id: { type: integer }
            name: { type: string }
            base_url: { type: string }
            provider: { type: string }
            poll_interval_seconds: { type: integer }
            outage_after_minutes: { type: integer }
            outage:
              description: >-
                Ausfallzustand. `since` = Beginn der Funkstille (letzter erfolgreicher Abruf),
                `last_error` = letzter Abruffehler. Mail an alle mit `external_sources:update` auf der Seite und
                Global Admins: einmal bei Ausfall, einmal bei Entwarnung, eine Erinnerung nach 24 Stunden.
              type: object
              properties:
                active: { type: boolean }
                since: { $ref: "#/components/schemas/NullableDateTime" }
                last_error: { type: string }
            active: { type: boolean }
            last_fetch_at: { $ref: "#/components/schemas/NullableDateTime" }
            last_fetch_ok: { type: [boolean, "null"], description: null = noch nie abgerufen. }
            last_error: { type: string }
            last_success_at: { $ref: "#/components/schemas/NullableDateTime" }
            page_url: { type: string, description: Von der Fremdseite gemeldete öffentliche Adresse. }
            incidents_synced_at: { $ref: "#/components/schemas/NullableDateTime", description: "erster erfolgreicher Abruf der Vorfälle (davor still)." }
            maintenances_synced_at: { $ref: "#/components/schemas/NullableDateTime" }
            incidents_error: { type: string, description: Letzter Fehler beim Abruf der Vorfälle/Wartungen (leer = ok); der Komponenten-Abruf bleibt davon unberührt. }
            component_count: { type: integer }
            link_count: { type: integer }
    ExternalComponent:
      allOf:
        - $ref: "#/components/schemas/GormModel"
        - type: object
          properties:
            external_source_id: { type: integer }
            external_id: { type: string }
            name: { type: string }
            is_group: { type: boolean }
            group_external_id: { type: string }
            group_name: { type: string }
            position: { type: integer }
            raw_status: { type: string, description: Status wie von der Fremdseite geliefert. }
            status: { $ref: "#/components/schemas/ExternalComponentStatus" }
            url: { type: string }
            last_seen_at: { type: string, format: date-time }
            vanished: { type: boolean }
            vanished_at: { $ref: "#/components/schemas/NullableDateTime" }
    ExternalImportResult:
      type: object
      properties:
        created:
          type: array
          items:
            type: object
            properties:
              component_id: { type: integer }
              name: { type: string }
              external_component_id: { type: integer }
              is_group: { type: boolean }
        skipped:
          type: array
          items:
            type: object
            properties:
              external_component_id: { type: integer }
              reason: { type: string, enum: [already_linked, vanished, empty_group] }
    ExternalLink:
      type: object
      properties:
        id: { type: integer }
        component_id: { type: integer }
        component_name: { type: string }
        external_component_id: { type: integer }
        external_component_name: { type: string }
        group_name: { type: string }
        source_id: { type: integer }
        source_name: { type: string }
        status:
          allOf:
            - $ref: "#/components/schemas/ExternalComponentStatus"
          description: Bei Gruppen das Schlimmste ihrer aktuellen Mitglieder.
        vanished: { type: boolean }
        is_group: { type: boolean, description: "Kopplung einer ganzen externen Gruppe." }
        worst:
          description: Bei Gruppen der Baustein mit dem schlechtesten Status.
          type: object
          properties:
            name: { type: string }
            status: { $ref: "#/components/schemas/ExternalComponentStatus" }
        warnings:
          type: array
          items: { type: string, enum: [overlaps_group] }
          description: "`overlaps_group`: dieselbe Komponente koppelt die Gruppe und einen ihrer Bausteine (erlaubt, ohne Wirkung auf den Status)."
    ExternalOutage:
      type: object
      properties:
        source_id: { type: integer }
        source_name: { type: string }
        base_url: { type: string }
        since: { $ref: "#/components/schemas/NullableDateTime" }
        last_error: { type: string }
        last_success_at: { $ref: "#/components/schemas/NullableDateTime" }
        notified_at: { $ref: "#/components/schemas/NullableDateTime" }
    AdminNotification:
      type: object
      description: Nachricht des Admin-Nachrichtencenters.
      properties:
        id: { type: integer }
        status_page_id: { type: integer, nullable: true, description: "null = systemweit (nur Global Admins)." }
        kind: { type: string, description: "z. B. external_source_outage, external_source_recovered, webhook_rate_limited, webhook_rejected" }
        severity: { type: string, enum: [info, warning, error] }
        title_key: { type: string, description: "i18n-Schlüssel (adminNotifications.*)" }
        body_key: { type: string }
        params: { type: object, additionalProperties: true, description: "Werte für die Texte (Kanal, ID, Sekunden), nie Geheimnisse." }
        link_path: { type: string, description: "Relativer Admin-Pfad, z. B. /admin/subscribers." }
        count: { type: integer, description: "Wie oft die Meldung innerhalb des Zusammenfassungsfensters (15 Minuten) auftrat." }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        resolved_at: { $ref: "#/components/schemas/NullableDateTime" }
        read: { type: boolean, description: Lesestatus des angemeldeten Benutzers. }
    ExternalIncident:
      type: object
      description: gespiegelter Vorfall oder gespiegelte Wartung einer externen Quelle.
      properties:
        id: { type: integer }
        source_id: { type: integer }
        source_name: { type: string, description: Name der externen Quelle (für "Quelle - Name"). }
        source_url: { type: string, description: Öffentliche Adresse der Fremdseite. }
        kind: { type: string, enum: [incident, maintenance] }
        external_id: { type: string }
        title: { type: string }
        status:
          type: string
          description: >-
            Normalisiert. Vorfall - investigating, identified, monitoring, resolved. Wartung - scheduled,
            in_progress, completed. Unbekannte Werte bleiben roh stehen und gelten als offen.
        raw_status: { type: string }
        impact: { type: string, enum: [none, minor, major, critical, maintenance] }
        closed: { type: boolean, description: Behoben bzw. abgeschlossen. }
        url: { type: string, description: Original-Meldung auf der Fremdseite (https). }
        started_at: { $ref: "#/components/schemas/NullableDateTime" }
        updated_at: { $ref: "#/components/schemas/NullableDateTime" }
        resolved_at: { $ref: "#/components/schemas/NullableDateTime" }
        scheduled_for: { $ref: "#/components/schemas/NullableDateTime" }
        scheduled_until: { $ref: "#/components/schemas/NullableDateTime" }
        affected_components:
          type: array
          description: Eigene Komponenten der Seite, die über eine Kopplung betroffen sind.
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
        external_components:
          type: array
          description: Die von der Quelle genannten Komponenten.
          items:
            type: object
            properties:
              external_id: { type: string }
              name: { type: string }
        updates:
          type: array
          description: Neueste zuerst.
          items:
            type: object
            properties:
              id: { type: string }
              status: { type: string }
              body: { type: string, description: "Klartext der Fremdseite (HTML-Tags entfernt, mehrzeilig möglich), trotzdem nicht als HTML ausgeben." }
              display_at: { type: string, format: date-time }
    ExternalFetchResult:
      type: object
      properties:
        ok: { type: boolean }
        not_modified: { type: boolean, description: 304 der Fremdseite (Conditional Request). }
        error: { type: string }
        fetched_at: { type: string, format: date-time }
        seen: { type: integer }
        created: { type: integer }
        vanished: { type: integer }
    ComponentCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 60, description: "Höchstens 60 Zeichen, sonst 400 mit `code: name_too_long`." }
        description: { type: string, maxLength: 240, description: "Höchstens 240 Zeichen, sonst 400 mit `code: description_too_long`." }
        slug: { type: string, maxLength: 60, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", description: "Kennung. Leer oder fehlend = automatisch aus dem Namen (Umlaute ausgeschrieben, bei Doppelung `-2`, `-3` …). Ungültig: 400 `code: slug_invalid`; auf der Statusseite vergeben: 409 `code: slug_taken`." }
        visible: { type: boolean, description: "Fehlt = sichtbar. false legt die Komponente öffentlich ausgeblendet an." }
        status: { $ref: "#/components/schemas/ComponentStatus", description: "Leer = operational." }
        parent_id: { type: [integer, "null"] }
        tag_ids:
          type: array
          items: { type: integer }
    ComponentUpdate:
      type: object
      required: [status]
      properties:
        name: { type: string, maxLength: 60, description: "Höchstens 60 Zeichen, sonst 400 mit `code: name_too_long`." }
        description: { type: string, maxLength: 240, description: "Höchstens 240 Zeichen, sonst 400 mit `code: description_too_long`." }
        slug: { type: string, description: "Die Kennung ist unveränderlich. Erlaubt ist nur der unveränderte Wert; jeder andere ergibt 400 `code: slug_immutable`." }
        visible: { type: boolean, description: "Fehlt = unverändert." }
        status: { type: string, description: "Komponentenstatus oder `group`." }
        parent_id: { type: [integer, "null"] }
        tag_ids:
          type: [array, "null"]
          description: Fehlt/null = unverändert, [] = alle Tags entfernen.
          items: { type: integer }
    ComponentIdList:
      type: string
      description: "`all` oder kommagetrennte Komponenten-IDs."
      examples: [all, "1,4,7"]

    # --- Vorfälle ---
    IncidentStatus:
      type: string
      description: "Vorfälle: investigating, identified, monitoring, resolved. Wartungsfenster: scheduled, in_progress, resolved."
      enum: [investigating, identified, monitoring, resolved, scheduled, in_progress]
    Incident:
      allOf:
        - $ref: "#/components/schemas/GormModel"
        - type: object
          properties:
            StatusPageID: { type: integer }
            Title: { type: string }
            Message: { $ref: "#/components/schemas/RichTextMessage" }
            Status: { $ref: "#/components/schemas/IncidentStatus" }
            Severity: { $ref: "#/components/schemas/IncidentSeverity" }
            IsMaintenance: { type: boolean }
            ScheduledStartAt: { $ref: "#/components/schemas/NullableDateTime" }
            ScheduledEndAt: { $ref: "#/components/schemas/NullableDateTime" }
            ReminderLeadMinutes: { type: integer, description: "0 = keine Erinnerung." }
            ReminderSentAt: { $ref: "#/components/schemas/NullableDateTime" }
            StartedAt: { $ref: "#/components/schemas/NullableDateTime" }
            ResolvedAt: { $ref: "#/components/schemas/NullableDateTime" }
            Components:
              type: array
              description: Betroffene Komponenten in Anzeigereihenfolge.
              items: { $ref: "#/components/schemas/Component" }
            Tags:
              type: [array, "null"]
              items: { $ref: "#/components/schemas/Tag" }
    IncidentSeverity:
      type: string
      enum: [degraded_performance, partial_outage, major_outage]
      description: "Schweregrad eines Vorfalls; gewichtet die 90-Tage-Verfügbarkeit mit 0,3 / 0,6 / 1,0. Wartungen tragen immer den Default."
    IncidentCreate:
      type: object
      required: [Title, Message, ComponentIDs]
      properties:
        Title: { type: string }
        Message: { $ref: "#/components/schemas/RichTextMessage" }
        Status: { $ref: "#/components/schemas/IncidentStatus", description: "Pflicht bei Vorfällen; bei Wartung optional (sonst aus den Zeiten abgeleitet)." }
        ComponentIDs:
          type: array
          minItems: 1
          items: { type: integer }
        TagIDs:
          type: array
          items: { type: integer }
        Severity: { $ref: "#/components/schemas/IncidentSeverity", description: "Optional, Default degraded_performance; ungültig = 400 invalid_incident_severity." }
        IsMaintenance: { type: boolean }
        ScheduledStartAt: { $ref: "#/components/schemas/NullableDateTime" }
        ScheduledEndAt: { $ref: "#/components/schemas/NullableDateTime" }
        ReminderLeadMinutes: { type: integer }
        StartedAt: { $ref: "#/components/schemas/NullableDateTime" }
        ResolvedAt: { $ref: "#/components/schemas/NullableDateTime", description: "Nur bei Status resolved, nicht vor StartedAt." }
    IncidentUpdateRequest:
      type: object
      required: [message, status]
      properties:
        title: { type: string }
        message: { $ref: "#/components/schemas/RichTextMessage" }
        status: { $ref: "#/components/schemas/IncidentStatus" }
        Severity: { $ref: "#/components/schemas/IncidentSeverity", description: "Fehlt = unverändert; bei Wartungen ignoriert." }
        ComponentIDs:
          type: array
          items: { type: integer }
        TagIDs:
          type: [array, "null"]
          description: Fehlt/null = unverändert, [] = alle Tags entfernen.
          items: { type: integer }
        ScheduledStartAt: { $ref: "#/components/schemas/NullableDateTime" }
        ScheduledEndAt: { $ref: "#/components/schemas/NullableDateTime" }
        ReminderLeadMinutes: { type: [integer, "null"] }
        StartedAt: { $ref: "#/components/schemas/NullableDateTime", description: "Fehlt = unverändert, null = zurücksetzen." }
        ResolvedAt: { $ref: "#/components/schemas/NullableDateTime", description: "Fehlt = unverändert, null = zurücksetzen." }
    IncidentUpdate:
      type: object
      properties:
        id: { type: integer }
        created_at: { type: string, format: date-time }
        incident_id: { type: integer }
        status: { $ref: "#/components/schemas/IncidentStatus" }
        message: { $ref: "#/components/schemas/RichTextMessage" }
        author_email: { type: string, description: Nur für Aufrufer mit `incidents:update` (bei Wartungen `maintenance:update`) auf der Seite enthalten. }
    ActionItem:
      type: object
      properties:
        id: { type: integer }
        post_mortem_id: { type: integer }
        text: { type: string }
        owner: { type: string }
        state: { type: string, enum: [open, in_progress, done] }
    PostMortem:
      type: object
      properties:
        id: { type: integer }
        incident_id: { type: integer }
        summary: { type: string }
        root_cause: { type: string }
        impact: { type: string }
        resolution: { type: string }
        detection: { type: string }
        published_at: { $ref: "#/components/schemas/NullableDateTime", description: "null = Entwurf." }
        actions:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/ActionItem" }
    PostMortemWrite:
      type: object
      properties:
        summary: { type: string }
        root_cause: { type: string }
        impact: { type: string }
        resolution: { type: string }
        detection: { type: string }
        publish: { type: boolean, description: Veröffentlicht einmalig (setzt published_at). }
        actions:
          type: array
          items:
            type: object
            properties:
              text: { type: string, description: Leere Einträge werden ignoriert. }
              owner: { type: string }
              state: { type: string, enum: ["", open, in_progress, done] }
    IncidentDetail:
      allOf:
        - $ref: "#/components/schemas/Incident"
        - type: object
          properties:
            updates:
              type: [array, "null"]
              items: { $ref: "#/components/schemas/IncidentUpdate" }
            post_mortem:
              oneOf:
                - $ref: "#/components/schemas/PostMortem"
                - type: "null"
    IncidentTemplate:
      allOf:
        - $ref: "#/components/schemas/GormModel"
        - $ref: "#/components/schemas/IncidentTemplateWrite"
        - type: object
          properties:
            StatusPageID: { type: integer }
    IncidentTemplateWrite:
      type: object
      required: [Name, Title, Message]
      properties:
        Name: { type: string, description: Interner Vorlagenname. }
        Kind: { type: string, enum: [incident, maintenance] }
        Title: { type: string }
        Message: { $ref: "#/components/schemas/RichTextMessage" }
        DefaultStatus: { type: string }
        ComponentIDs: { type: string, description: Kommagetrennte Komponenten-IDs. }

    # --- Hinweise ---
    GeneralNotice:
      allOf:
        - $ref: "#/components/schemas/GormModel"
        - type: object
          properties:
            StatusPageID: { type: integer }
            Title: { type: string }
            Message: { $ref: "#/components/schemas/RichTextMessage" }
            Level: { type: string, enum: [info, warning, critical] }
            IsActive: { type: boolean }
            Collapsed: { type: boolean }
            StartAt: { $ref: "#/components/schemas/NullableDateTime" }
            EndAt: { $ref: "#/components/schemas/NullableDateTime" }
            NotifySubscribers: { type: boolean }
    NoticeWrite:
      type: object
      required: [Title, Message]
      properties:
        Title: { type: string }
        Message: { $ref: "#/components/schemas/RichTextMessage" }
        Level: { type: string, enum: ["", info, warning, critical], description: "Leer = info." }
        IsActive: { type: [boolean, "null"] }
        Collapsed: { type: boolean }
        StartAt: { $ref: "#/components/schemas/NullableDateTime" }
        EndAt: { $ref: "#/components/schemas/NullableDateTime", description: Muss nach StartAt liegen. }
        NotifySubscribers: { type: [boolean, "null"] }

    # --- Übersetzungen ---
    TranslationBase:
      allOf:
        - $ref: "#/components/schemas/GormModel"
        - type: object
          properties:
            LanguageCode: { type: string }
            Title: { type: string }
            Status: { type: string, enum: [draft, confirmed] }
            Source: { type: string, examples: [manual, ai] }
    IncidentUpdateTranslation:
      type: object
      description: Übersetzung der Nachricht eines Vorfall-Updates.
      properties:
        LanguageCode: { type: string }
        Message: { $ref: "#/components/schemas/RichTextMessage" }
        Status: { type: string, enum: [draft, confirmed] }
        Source: { type: string }
    PublicUpdateTranslations:
      type: object
      description: Bestätigte Update-Nachrichten in der Sprache des Besuchers.
      properties:
        language: { type: string }
        default_language: { type: string }
        updates:
          type: object
          description: Update-ID (als Zeichenkette) → Nachricht. Updates ohne bestätigte Übersetzung fehlen.
          additionalProperties: { type: string }
    IncidentTranslation:
      allOf:
        - $ref: "#/components/schemas/TranslationBase"
        - type: object
          properties:
            IncidentID: { type: integer }
            Incident: { type: object, description: Nicht vorgeladen. }
            Message: { $ref: "#/components/schemas/RichTextMessage" }
    IncidentTemplateTranslation:
      allOf:
        - $ref: "#/components/schemas/TranslationBase"
        - type: object
          properties:
            IncidentTemplateID: { type: integer }
            IncidentTemplate: { type: object, description: Nicht vorgeladen. }
            Message: { $ref: "#/components/schemas/RichTextMessage" }
    ComponentTranslation:
      allOf:
        - $ref: "#/components/schemas/TranslationBase"
        - type: object
          properties:
            ComponentID: { type: integer }
            Component: { type: object, description: Nicht vorgeladen. }
            Description: { type: string }
    GeneralNoticeTranslation:
      allOf:
        - $ref: "#/components/schemas/TranslationBase"
        - type: object
          properties:
            GeneralNoticeID: { type: integer }
            GeneralNotice: { type: object, description: Nicht vorgeladen. }
            Message: { $ref: "#/components/schemas/RichTextMessage" }
    TranslationCreateWithMessage:
      type: object
      required: [language_code, title, message, source]
      properties:
        language_code: { type: string }
        title: { type: string }
        message: { $ref: "#/components/schemas/RichTextMessage" }
        source: { type: string, examples: [manual, ai] }
    TranslationCreateWithDescription:
      type: object
      required: [language_code, title, description, source]
      properties:
        language_code: { type: string }
        title: { type: string }
        description: { type: string }
        source: { type: string, examples: [manual, ai] }

    # --- Dashboard ---
    AvailabilityDay:
      type: object
      required: [date, status, availability, downtime_seconds]
      properties:
        date: { type: string, format: date, description: UTC-Tag. }
        status:
          description: Schlechtester Status des Tages; `no_data` = keine Beobachtung.
          type: string
          enum: [operational, degraded_performance, under_maintenance, no_data]
        availability:
          type: [number, "null"]
          minimum: 0
          maximum: 100
          description: Prozent der beobachteten Zeit ohne Vorfall; null bei `no_data`.
        downtime_seconds: { type: integer, description: Dauer der Beeinträchtigung (Wartung ausgenommen). }
    PublicTranslationTexts:
      type: object
      required: [title, text]
      properties:
        title: { type: string, description: "Name (Komponente) bzw. Titel (Vorfall, Ankündigung)." }
        text: { type: string, description: "Beschreibung (Komponente) bzw. Meldung (Vorfall, Ankündigung)." }
    PublicTranslations:
      type: object
      required: [language, default_language, components, incidents, notices]
      properties:
        language: { type: string, description: "Angefragte Sprache (ohne `lang` die Standardsprache der Seite)." }
        default_language: { type: string, description: "Standardsprache der Seite, leer wenn keine gepflegt ist." }
        components:
          type: object
          description: Komponenten-ID (als Zeichenkette) zu Texten; fehlt eine ID, gilt das Original.
          additionalProperties: { $ref: "#/components/schemas/PublicTranslationTexts" }
        incidents:
          type: object
          additionalProperties: { $ref: "#/components/schemas/PublicTranslationTexts" }
        notices:
          type: object
          additionalProperties: { $ref: "#/components/schemas/PublicTranslationTexts" }
    Availability:
      type: object
      required: [generated_at, from, to, uptime_percent, days]
      properties:
        generated_at: { type: string, format: date-time }
        from: { type: string, format: date }
        to: { type: string, format: date }
        uptime_percent:
          type: [number, "null"]
          description: Verfügbarkeit über das Fenster, nach beobachteter Dauer gewichtet; null ohne Daten.
        history_truncated:
          type: boolean
          description: |
            `true`, wenn die Statushistorie je Komponente auf die neuesten
            10.000 Wechsel des Fensters gekürzt wurde (Dauerflattern); ältere
            Beeinträchtigungen zählen dann als Betrieb. Fehlt, wenn nicht gekürzt wurde.
        days:
          type: array
          description: 90 Einträge, älteste zuerst, letzter = heute (UTC).
          items: { $ref: "#/components/schemas/AvailabilityDay" }
        components:
          type: array
          description: Nur mit `?include=components`; Reihenfolge wie im Komponentenbaum, ohne Gruppen.
          items:
            type: object
            required: [id, name, uptime_percent, days]
            properties:
              id: { type: integer }
              name: { type: string }
              uptime_percent: { type: [number, "null"] }
              days:
                type: array
                items: { $ref: "#/components/schemas/AvailabilityDay" }
    Dashboard:
      type: object
      required: [page, components, incidents, notices]
      properties:
        external_incidents:
          type: array
          description: offene und in den letzten 14 Tagen beendete Meldungen externer Quellen, die gekoppelte Komponenten betreffen.
          items: { $ref: "#/components/schemas/ExternalIncident" }
        page: { $ref: "#/components/schemas/PublicStatusPage" }
        languages:
          type: array
          description: die für die Seite aktivierten Sprachen (nach Code sortiert) für den Sprachumschalter; leer, wenn keine gepflegt ist.
          items:
            type: object
            required: [code, name, is_default]
            properties:
              code: { type: string, examples: [hr] }
              name: { type: string, description: Eigenbezeichnung aus dem Sprachkatalog., examples: [Hrvatski] }
              is_default: { type: boolean }
        components:
          type: array
          description: Komponentenbaum, Status mit offenen Vorfällen überlagert.
          items: { $ref: "#/components/schemas/Component" }
        incidents:
          type: array
          description: Alle offenen und die neuesten behobenen Vorfälle und Wartungen, offene zuerst.
          items: { $ref: "#/components/schemas/Incident" }
        incidents_more:
          type: boolean
          description: Es gibt ältere behobene Vorfälle als die gelieferten.
        notices:
          type: array
          items: { $ref: "#/components/schemas/GeneralNotice" }

    # --- Auth / Me ---
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
      example: { email: admin@example.com, password: geheim123 }
    LoginResponse:
      type: object
      required: [token]
      properties:
        token: { type: string, description: "JWT für `X-Auth-Token` (oder `Authorization: Bearer`), 2 h gültig." }
        email: { type: string }
        role: { type: string }
        permissions: { type: string, description: Kommagetrennt. }
        tag_ids:
          type: array
          items: { type: integer }
        is_global_admin: { type: boolean }
        preferred_language: { type: string }
    Me:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        role: { type: string }
        permissions: { type: string }
        tag_ids:
          type: array
          items: { type: integer }
        is_global_admin:
          type: boolean
          description: Bei einem Token mit `sso_page_id` immer `false`.
        preferred_language: { type: string }

    # --- Abos ---
    SubscribeRequest:
      type: object
      required: [channel, component_ids, slug]
      properties:
        channel: { type: string, enum: [email, google_chat] }
        email: { type: string, format: email, description: Pflicht bei `email`. }
        webhook_url: { type: string, format: uri, description: "Pflicht bei `google_chat`; https, keine internen Adressen." }
        component_ids: { $ref: "#/components/schemas/ComponentIdList" }
        slug: { type: string, description: Slug der Statusseite. }
        language: { type: string, description: "Optional: Sprache der Benachrichtigungsmails. Nur bei der Seite aktive Sprachcodes werden gespeichert, sonst gilt die Standardsprache der Seite." }
      example: { channel: email, email: max@example.com, component_ids: all, slug: acme, language: en }
    SubscriberStatus:
      type: string
      enum: [pending, active]
    SubscribeResponse:
      type: object
      required: [message, channel, status]
      properties:
        message: { type: string }
        channel: { type: string, enum: [email, google_chat] }
        status: { $ref: "#/components/schemas/SubscriberStatus" }
    MySubscription:
      type: object
      properties:
        channel: { type: string, enum: [email, google_chat] }
        email: { type: string }
        webhook_url: { type: string }
        component_ids: { $ref: "#/components/schemas/ComponentIdList" }
        status: { $ref: "#/components/schemas/SubscriberStatus" }
        language: { type: string, description: "Mailsprache; leer = Standardsprache der Seite." }
    Subscriber:
      allOf:
        - $ref: "#/components/schemas/GormModel"
        - type: object
          properties:
            StatusPageID: { type: integer }
            StatusPage: { type: object, description: Nicht vorgeladen. }
            Email: { type: string }
            WebhookURL: { type: string }
            Channel: { type: string, enum: [email, google_chat] }
            SubscribedComponentIDs: { $ref: "#/components/schemas/ComponentIdList" }
            CreatedByUserID: { type: [integer, "null"] }
            CreatedBy:
              oneOf:
                - $ref: "#/components/schemas/User"
                - type: "null"
            Status: { $ref: "#/components/schemas/SubscriberStatus" }
            Language: { type: string, description: "Mailsprache des Abonnenten; leer = Standardsprache der Seite." }
    SubscriberAdmin:
      type: object
      description: |
        Abonnent in den Admin-Antworten (Liste, Anlegen, Ändern). `CreatedBy` trägt nie ein
        Kontoobjekt: `Email` ist nur gesetzt, wenn das anlegende Konto selbst eine Rolle auf
        dieser Seite hat oder der Anfragende ist; sonst ist sie leer (`CreatedBy` = „mit Konto
        verknüpft“). Ohne Konto ist `CreatedBy` null.
      properties:
        ID: { type: integer }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
        StatusPageID: { type: integer }
        Email: { type: string }
        WebhookURL: { type: string }
        Channel: { type: string, enum: [email, google_chat] }
        SubscribedComponentIDs: { $ref: "#/components/schemas/ComponentIdList" }
        Language: { type: string, description: "Mailsprache des Abonnenten; leer = Standardsprache der Seite." }
        Status: { $ref: "#/components/schemas/SubscriberStatus" }
        CreatedBy:
          oneOf:
            - type: object
              properties:
                Email: { type: string }
            - type: "null"
    SubscriberWrite:
      type: object
      required: [Channel]
      properties:
        Channel: { type: string, enum: [email, google_chat] }
        Email: { type: string, format: email }
        WebhookURL: { type: string, format: uri }
        SubscribedComponentIDs: { $ref: "#/components/schemas/ComponentIdList" }
        Language: { type: string, description: "Mailsprache: ein bei der Seite aktiver Sprachcode (Liste: `languages` im Dashboard); leer oder unbekannt = Standardsprache der Seite. Beim Ändern: ohne Feld bleibt sie unverändert." }

    # --- Bestellungen ---
    OrderCreate:
      type: object
      required: [company_name, email]
      properties:
        company_name: { type: string }
        email: { type: string, format: email }
        slug: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", description: "Optional, sonst aus dem Namen erzeugt." }
        website: { type: string, description: Honeypot – muss leer bleiben. }

    # --- Nutzer / Rollen / Tags ---
    Role:
      allOf:
        - $ref: "#/components/schemas/GormModel"
        - type: object
          properties:
            Name: { type: string }
            Permissions: { type: string, description: "Kommagetrennt, z. B. `incidents:read,incidents:create,incidents:update,incidents:delete`." }
    RoleWrite:
      type: object
      required: [name]
      properties:
        name: { type: string }
        permissions: { type: string }
    SystemSettings:
      type: object
      description: |
        Globale Systemeinstellungen. Die Struktur ist bewusst ein
        Objekt, damit weitere Schalter additiv dazukommen können.
      required: [orders_enabled]
      properties:
        orders_enabled:
          type: boolean
          description: Ob die Self-Service-Bestellung (öffentliche Route /order) aktiv ist.
        email_enabled:
          type: boolean
          description: Ob E-Mails versendet werden. Fehlt der Key, gilt true.
        selfmonitor_enabled:
          type: boolean
          description: Ob die automatische Selbstüberwachung der Systemseite läuft. Fehlt der Key, gilt false (aus).
    TranslationSettings:
      type: object
      description: |
        Einstellungen der automatischen Übersetzung. Der Schlüssel
        ist nie enthalten.
      properties:
        provider: { type: string, description: 'Leer = Standard (LibreTranslate aus der Umgebung), sonst libretranslate oder deepl.' }
        url: { type: string, description: LibreTranslate-Adresse (nur https). }
        api_key_set: { type: boolean }
        env_url_set: { type: boolean, description: Der Betreiber hat LIBRETRANSLATE_URL gesetzt. }
        env_api_key_set: { type: boolean }
        effective_provider: { type: string }
        configured: { type: boolean, description: Es gibt einen nutzbaren Dienst. }
    Tag:
      allOf:
        - $ref: "#/components/schemas/GormModel"
        - type: object
          properties:
            Name: { type: string }
            StatusPageID: { type: [integer, "null"], description: "null = globaler Tag." }
            StatusPage: { type: [object, "null"] }
    User:
      allOf:
        - $ref: "#/components/schemas/GormModel"
        - type: object
          properties:
            Email: { type: string }
            RoleID: { type: integer }
            Role: { $ref: "#/components/schemas/Role" }
            SSOProvider: { type: string }
            SSOSubject: { type: string }
            IsGlobalAdmin: { type: boolean }
            PreferredLanguage: { type: string }
            UserStatusPageRoles:
              type: [array, "null"]
              items: { $ref: "#/components/schemas/UserStatusPageRole" }
    UserWithTags:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            Tags:
              type: [array, "null"]
              items: { $ref: "#/components/schemas/Tag" }
    UserWrite:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        tag_ids:
          type: array
          items: { type: integer }
        is_global_admin: { type: boolean }
        page_roles:
          type: array
          items:
            type: object
            properties:
              status_page_id: { type: integer }
              role_id: { type: integer }
    UserStatusPageRole:
      allOf:
        - $ref: "#/components/schemas/GormModel"
        - type: object
          properties:
            UserID: { type: integer }
            User: { type: object }
            StatusPageID: { type: integer }
            StatusPage: { type: object }
            RoleID: { type: integer }
            Role: { type: object }

    # --- Sprachen / Vorlagen / UI ---
    Language:
      allOf:
        - $ref: "#/components/schemas/GormModel"
        - type: object
          properties:
            Code: { type: string, examples: [de] }
            Name: { type: string, examples: [Deutsch] }
            IsActive: { type: boolean }
    LanguageWrite:
      type: object
      required: [name]
      properties:
        code: { type: string, description: "Nur beim Anlegen, wird kleingeschrieben." }
        name: { type: string }
        is_active: { type: [boolean, "null"] }
    StatusPageLanguage:
      allOf:
        - $ref: "#/components/schemas/GormModel"
        - type: object
          properties:
            StatusPageID: { type: integer }
            StatusPage: { type: object }
            LanguageCode: { type: string }
            Language: { type: object }
            IsDefault: { type: boolean }
    NotificationKind:
      type: string
      enum:
        - incident_created
        - incident_updated
        - incident_resolved
        - maintenance_reminder
        - maintenance_started
        - maintenance_completed
        - notice_created
        - notice_updated
        - notice_ended
        - subscription_confirm
        - external_incident_created
        - external_incident_updated
        - external_incident_resolved
        - external_maintenance_created
        - external_maintenance_updated
        - external_maintenance_resolved
    NotificationTemplate:
      allOf:
        - $ref: "#/components/schemas/GormModel"
        - type: object
          properties:
            StatusPageID: { type: integer }
            StatusPage: { type: object }
            Kind: { $ref: "#/components/schemas/NotificationKind" }
            Audience: { type: string, enum: [staff, subscriber] }
            Language: { type: string }
            Subject: { type: string }
            BodyHTML: { type: string }
    NotificationTemplateWrite:
      type: object
      required: [Subject, BodyHTML]
      properties:
        Subject: { type: string, description: Go-Template. }
        BodyHTML: { type: string, description: Go-HTML-Template. }
    UiOverride:
      type: object
      required: [language_code, key, value]
      properties:
        language_code: { type: string }
        key: { type: string, pattern: "^[a-zA-Z0-9_-]+(\\.[a-zA-Z0-9_-]+)*$" }
        value: { type: string }
    UiOverrideMap:
      type: object
      additionalProperties: { type: string }
      example: { nav.home: Startseite }

    # --- Plattform ---
    AuditLog:
      type: object
      properties:
        id: { type: integer }
        created_at: { type: integer, description: Unix-Sekunden. }
        actor_id: { type: [integer, "null"], description: "null = System." }
        actor_email: { type: string }
        actor_role: { type: string }
        action: { type: string, examples: [incident.created] }
        category: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        target_name: { type: string }
        status_page_id: { type: [integer, "null"] }
        ip: { type: string }
        details: { type: string }
    Overview:
      type: object
      properties:
        pages:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              slug: { type: string }
              status: { type: string }
              open_incidents: { type: integer }
              subscribers: { type: integer }
              components: { type: integer }
        total_pages: { type: integer }
        total_open_incidents: { type: integer }
        total_subscribers: { type: integer }
        worst_status: { type: string }
    MonitoringCounters:
      type: object
      properties:
        request_count: { type: integer }
        error_count: { type: integer, description: "Antworten mit Status 5xx (4xx zählen nicht als Fehler)." }
        error_rate: { type: number, description: "error_count / request_count (0 bis 1); nur 5xx." }
        requests_per_minute: { type: number }
        avg_latency_ms: { type: number }
        p50_latency_ms: { type: number }
        p95_latency_ms: { type: number }
        max_latency_ms: { type: number }
    Monitoring:
      type: object
      properties:
        generated_at: { type: string, format: date-time }
        uptime_seconds: { type: number }
        grafana_dashboard_url:
          type: string
          description: Link auf das Grafana-Dashboard der Umgebung (Env `GRAFANA_DASHBOARD_URL`, nur http(s)); leer, wenn nicht konfiguriert.
        totals: { $ref: "#/components/schemas/MonitoringCounters" }
        routes:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/MonitoringCounters"
              - type: object
                properties:
                  method: { type: string }
                  route: { type: string }
                  status_counts:
                    type: object
                    additionalProperties: { type: integer }
        saturation:
          type: object
          properties:
            goroutine_count: { type: integer }
            heap_alloc_bytes: { type: integer }
            heap_sys_bytes: { type: integer }
            total_alloc_bytes: { type: integer }
            sys_bytes: { type: integer }
            num_gc: { type: integer }
            db_stats_available: { type: boolean }
            db_max_open_connections: { type: integer }
            db_open_connections: { type: integer }
            db_in_use: { type: integer }
            db_idle: { type: integer }
            db_wait_count: { type: integer }
            db_wait_duration_ms: { type: number }
