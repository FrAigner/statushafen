# Handgeschriebene API-Dokumentation von Statushafen.
#
# Diese Datei wird NICHT generiert. backend/apidoc_test.go gleicht sie bei
# jedem `go test` mit den in backend/main.go registrierten Routen ab
# (beide Richtungen) und prüft, dass sie gültiges OpenAPI 3.1 ist. Wer eine
# Route hinzufügt, ändert oder entfernt, pflegt sie hier im selben PR nach.
# Hinweise zum Ansehen und Pflegen: docs/api/README.md.
openapi: 3.1.0
info:
  title: Statushafen API
  version: "1.0"
  summary: REST-API von Statushafen (Statusseiten, Vorfälle, Abonnements).
  description: |
    Statushafen stellt Statusseiten für mehrere Mandanten bereit. Diese
    Spezifikation beschreibt alle HTTP-Endpunkte des Backends.

    **Vollständig beschrieben** (Parameter, Request-/Response-Schemas,
    Fehlerantworten) sind die Endpunkte, die Externe nutzen: öffentliche
    Lese-API, Login/SSO, Abonnieren und Bestätigen, Monitoring-Webhook,
    Seitenbestellung sowie die Konto-Endpunkte unter `/api/me`.
    Die Admin-Endpunkte sind mit benötigter Berechtigung, Kurzbeschreibung
    und – wo eindeutig aus den Models ableitbar – Schemas dokumentiert.

    ## Authentifizierung

    | Verfahren | Wo | Verwendung |
    |---|---|---|
    | `authToken` | `X-Auth-Token: <JWT>` | **Bevorzugter Weg**: Login-Token aus `POST /api/login` bzw. `POST /api/auth/sso-exchange`, HS256, gültig 2 Stunden, ohne `Bearer`-Präfix. Das Token wird bei jeder Anfrage mit dem Konto abgeglichen: Nach Passwortwechsel, geänderten Global-Admin-Rechten, geänderten Seitenrollen oder Löschung des Kontos antworten alle Routen mit 401. Ein vorgeschalteter Basic-Auth-Schutz (z. B. Staging) belegt `Authorization`, deshalb der eigene Header. Pflicht für alle geschützten Routen, optional für die öffentlichen Lese-Routen (dann sind private Seiten sichtbar, für die der Nutzer eine Rolle hat). Ist er gesetzt, hat er Vorrang vor `Authorization`, auch wenn das Token ungültig ist. |
    | `bearerAuth` | `Authorization: Bearer <JWT>` | Dasselbe Login-Token, für API-Clients und Bestandsnutzer weiterhin akzeptiert, solange `X-Auth-Token` fehlt. |
    | `webhookToken` / `webhookTokenQuery` | Header `X-Webhook-Token` oder Query `token` | Monitoring-Webhook einer Statusseite. Token wird von einem Seiten-Admin per `POST /api/admin/pages/{page_id}/webhook-token` erzeugt (einmalig im Klartext geliefert). |
    | `subscriberToken` | Query `token` | Signierter Subscriber-Token aus Benachrichtigungsmails (Abbestellen, Lesezugriff auf private Seiten). Läuft 400 Tage nach der Ausstellung ab (jede neue Benachrichtigung bringt einen frischen Link), wird zusätzlich durch Löschen des Abos ungültig. Wird als Login-Token abgelehnt. |
    | `metricsBasicAuth` | HTTP Basic | Nur `/metrics`, Zugangsdaten aus `METRICS_BASIC_AUTH_USER`/`METRICS_BASIC_AUTH_PASSWORD`. Ohne diese Variablen ist `/metrics` nicht registriert. |
    | `internalToken` | Header `X-Internal-Token` | Nur `/api/internal/custom-domain-check` (Caddy); außerhalb der Entwicklung Pflicht (`CADDY_INTERNAL_TOKEN`). |

    ## Berechtigungen

    Admin-Endpunkte tragen die Erweiterung `x-required-permission`:

    - `global-admin`: nur Nutzer mit `is_global_admin`.
    - `<ressource>:<aktion>` (z. B. `incidents:update`): Global Admin **oder**
      eine Rolle auf genau der Statusseite aus dem Pfadparameter
      `page_id`, deren Permissions-Liste das Recht enthält. Die Ressource
      ist ein Tab der Admin-Navigation, die Aktion `create`, `read`,
      `update` oder `delete` und folgt der HTTP-Methode (GET = `read`,
      POST = `create`, PUT/PATCH = `update`, DELETE = `delete`);
      Sonderaktionen (z. B. `POST …/external-sources/{id}/fetch` =
      `update`, `POST …/notification-templates/…/preview` = `read`,
      Webhook-Token und Custom Domain = `pages:update`) sind je Route
      festgelegt. `a|b` heißt: mindestens eines der Rechte; `a&b`: alle
      (der Import externer Bausteine braucht `external_sources:create` und
      `components:create`); `incidents:<aktion>|maintenance:<aktion>`:
      Vorfälle und Wartungen teilen sich die Routen, die Art des
      Datensatzes entscheidet (Anlegen: Feld `IsMaintenance`). Bei den
      Übersetzungs-Routen (ohne `page_id` im Pfad) wird die Seite aus der
      Ressource (Vorfall, Komponente, Hinweis bzw. Übersetzung) abgeleitet;
      unbekannte Ressourcen liefern 404, fremde Seiten 403.
    - `page-role`: Global Admin oder irgendeine Rolle auf der Seite aus
      `page_id`.
    - `authenticated`: jeder gültige Login-Token.

    ### Sitzungen aus einem Seiten-SSO-Login

    Ein Login-Token aus dem OIDC- oder SAML-SSO einer Statusseite trägt den
    Claim `sso_page_id` (die Seite, deren IdP die Anmeldung bestätigt hat).
    Passwort- und Google/GitHub-Logins haben ihn nicht. Mit
    `sso_page_id` gilt:

    - Seitengebundene Rechte (`<bereich>:<recht>`, `page-role`) nur für diese
      Seite. Jede andere Seite liefert `403`, auch wenn der Nutzer dort eine
      Rolle hat.
    - `global-admin`-Routen liefern immer `403`, auch wenn der Nutzer
      inzwischen Global Admin ist. `GET /api/me` meldet dann
      `is_global_admin: false`.
    - Private Seiten (öffentliche Lese-Routen) sind nur für diese Seite
      sichtbar; ein Auto-Join auf anderen Seiten findet nicht statt.
    - `GET /api/me/pages` liefert höchstens diese Seite.
    - Die übrigen `authenticated`-Routen (eigenes Konto unter `/api/me`,
      eigene SSO-Verknüpfungen) funktionieren unverändert.

    ## Rate-Limits

    Einige öffentliche Endpunkte sind pro Client-IP begrenzt (Token-Bucket,
    `x-rate-limit` an der Operation). Bei Überschreitung antwortet der
    Server mit `429`, `Retry-After: 60` und einer Fehlermeldung. Die IP
    stammt aus `X-Forwarded-For` nur, wenn der Absender in
    `TRUSTED_PROXIES` steht, sonst aus der TCP-Verbindung.
    Bei IPv6 zählt das /64-Netz der Adresse, nicht die einzelne Adresse.

    `POST /api/login` hat zusätzlich eine Sperre je Konto (E-Mail, ohne
    Rücksicht auf Groß-/Kleinschreibung) und Quelle (IPv4-Adresse bzw.
    IPv6-/64): Ab 10 Fehlversuchen in Folge von derselben Quelle antwortet der
    Server dieser Quelle `429` mit `rate_limited` und `Retry-After` (zunächst
    30 Sekunden, bei weiteren Fehlversuchen verdoppelt bis 15 Minuten). Die
    Antwort ist für bekannte und unbekannte E-Mail-Adressen gleich; ein
    erfolgreicher Login setzt den Zähler zurück. Die Sperre trifft nur die
    Quelle der Fehlversuche, nicht den Login des Nutzers von einer anderen
    Adresse. Greifen viele Quellen dasselbe Konto an (ab 100 Fehlversuchen in
    15 Minuten über alle Quellen), wird jeder Versuch für dieses Konto
    zunehmend verzögert (bis 3 Sekunden Wartezeit), aber nie gesperrt. Prüfung
    und Zählung eines Versuchs sind atomar, gleichzeitige Versuche überschreiten
    die Schwelle nicht.

    | Endpunkt | Limit |
    |---|---|
    | `POST /api/login`, `GET /api/auth/oidc/login`, `GET /api/auth/oidc/callback`, `GET /api/auth/{provider}`, `GET /api/auth/{provider}/callback`, `POST /api/webhooks/components/{component_id}/status`, `POST /api/webhooks/component-slugs/{slug}/status`, `GET`/`POST /api/public/subscribers/unsubscribe`, `GET /api/auth/saml/login`, `POST /api/auth/saml/{page_id}/acs`, `POST /api/admin/pages/{page_id}/sso/saml-test`, `POST /api/public/subscribers/confirm`, `POST /api/public/orders/confirm`, `POST /api/admin/pages/{page_id}/sso/test` | 20/min |
    | `POST /api/subscribe`, `POST /api/subscribe/test-webhook`, `POST /api/auth/sso-exchange`, `POST /api/public/orders/set-password` | 10/min |
    | `POST /api/public/orders` | 5/min |
    | `GET /api/public/resolve-domain`, `GET /api/public/pages/{slug}/sso`, `GET /api/auth/saml/{page_id}/metadata` | 60/min |
    | `GET /api/public/pages/{slug}/dashboard`, `GET /api/pages/{page_id}/incidents`, `GET /api/pages/{page_id}/incidents/{id}`, `GET /api/pages/slug/{slug}`, `GET /api/pages/{page_id}/components`, `GET /api/pages/{page_id}/notices`, `GET /api/public/pages`, `GET /api/public/ui-overrides`, `GET /api/incidents/{incident_id}/translations`, `GET /api/components/{component_id}/translations`, `GET /api/notices/{notice_id}/translations` | 120/min je Route |
    | `POST /api/admin/pages/{page_id}/custom-domain/verify` (löst eine DNS-Abfrage aus) | 10/min je Seite, 10/min je Nutzer |
    | `POST /api/pages/{page_id}/incidents`, `POST /api/pages/{page_id}/notices` (lösen Benachrichtigungen aus) | 30/Stunde je Seite, 60/Stunde je Nutzer |
    | `PUT /api/pages/{page_id}/incidents/{id}`, `POST /api/pages/{page_id}/incidents/{id}/updates`, `PUT /api/pages/{page_id}/notices/{id}`, `PUT /api/pages/{page_id}/subscribers/{id}` | 120/Stunde je Seite, 120/Stunde je Nutzer |

    Die beiden letzten Zeilen zählen je Seite (Pfad) und je angemeldetem Nutzer und
    antworten bei Überschreitung mit `429`, `rate_limited` und `Retry-After`
    (Sekunden bis zum nächsten freien Platz).

    ## Konventionen

    - Private Seiten: Wer die Seite nicht lesen darf (anonym, ohne Rolle auf der
      Seite, Subscriber-Token einer anderen Seite), bekommt auf allen öffentlichen
      Lese-Routen zur Seite und ihren Unterobjekten (Dashboard, Verfügbarkeit,
      Übersetzungen, Komponenten, Vorfälle, Hinweise, SSO-Auskunft) genau
      dieselbe `404`-Antwort wie bei einer Seite oder ID, die es nicht gibt –
      nie `401` oder `403`. Damit lässt sich von außen nicht erkennen, welche
      Slugs und IDs zu privaten Seiten gehören. Das Anmelden bleibt möglich:
      Wer eine Rolle hat, sieht die Inhalte; ein Konto mit passender
      E-Mail-Domain wird wie bisher beim ersten Aufruf automatisch aufgenommen.
    - Fehler haben die Form `{"error": "<Meldung>", "code": "<Code>"}`. Der
      `code` ist maschinenlesbar und stabil (z. B. `invalid_request`,
      `forbidden`, `slug_taken`, `slug_reserved`, `password_too_short`, `password_too_long`,
      `language_code_invalid`, `group_not_empty`, `request_too_large`, `server_error`), die Meldung
      ist ein Text für Menschen (teils deutsch, teils englisch) und kann sich
      ändern. Das Frontend übersetzt den Code. Noch nicht jeder Fehler trägt
      einen `code`; ältere Antworten haben nur `error`.
    - Request-Bodys sind auf 1 MiB begrenzt (SAML-ACS: 2 MiB, einzelne Routen
      enger, z. B. Komponenten-Webhooks 4 KiB). Eine größere Anfrage beantwortet
      der Server mit `413` und dem Code `request_too_large`.
    - Ein NUL-Byte (rohes Byte oder JSON-Escape `\u0000`, auch in Schlüsseln und
      verschachtelten Werten) sowie ungültiges UTF-8 im Body, in Query-Parametern
      oder im Pfad lehnt der Server bei jeder Route vor dem Handler mit
      `400` und dem Code `input_invalid_characters` ab. Formularkodierte Bodys
      (SAML-Rückkanal) sind davon ausgenommen.
    - Nachrichten und Beschreibungen (Vorfall, Vorfall-Update, Wartung,
      Ankündigung, Vorlagen und deren Übersetzungen) sind eingeschränktes
      Markdown, höchstens 5000 Zeichen (`message_too_long`), siehe Schema
      `RichTextMessage`. Mails enthalten sie als HTML und als Klartext
      (`{{.MessageHTML}}` bzw. `{{.Message}}` in eigenen Mail-Vorlagen),
      Chat und Webhooks als Klartext.
    - Titel (Vorfall, Ankündigung, Vorlage und deren Übersetzungen) und Seitennamen
      sind auf 200 Zeichen begrenzt (`400` mit `title_too_long` bzw.
      `page_name_too_long`), Komponentennamen auf 60 (`name_too_long`).
    - Eingaberegeln, die das Backend mit `400` und `code` prüft: Slugs
      bestehen aus Kleinbuchstaben, Ziffern und einzelnen Bindestrichen und
      dürfen nicht reserviert sein (`www`, `staging`, `api`, `admin`, `app`,
      `mail`, `login`, `docs`, `status`, `order`, `auth`, `subscribe`,
      `unsubscribe`, `profile`, `healthz`, `static`, `assets`, `fonts`,
      `system`). Passwörter haben mindestens 8 Zeichen und höchstens 72 Byte
      (`password_too_long`, bcrypt-Grenze). Sprachcodes
      entsprechen `^[a-z]{2,3}(-[a-z0-9]{2,8})*$` (Großbuchstaben werden
      kleingeschrieben).
    - `create`, `update` und `delete` schließen `read` derselben Ressource ein:
      Eine Rolle mit `components:update` besteht auch eine Prüfung auf
      `components:read`. Der Altwert `<ressource>:write` wird nicht mehr
      vergeben (eine Migration beim Start ersetzt ihn durch alle vier
      Aktionen); beim Prüfen zählt er weiter als `create`, `read`, `update`
      und `delete` derselben Ressource, damit Altrollen und Alt-Token bis zur
      Bereinigung funktionieren. Die Rechte einer Anfrage kommen immer
      frisch aus der Rolle in der Datenbank, nie aus dem Token.
    - Viele Models werden ohne JSON-Tags serialisiert; ihre Felder heißen
      dann wie im Go-Code (`ID`, `CreatedAt`, `Name`, `StatusPageID`, …).
      Neuere Endpunkte verwenden `snake_case`. Die Schemas unten geben die
      tatsächliche Schreibweise wieder. Beim Einlesen ist Go
      groß-/kleinschreibungstolerant (`title` = `Title`).
    - Zeitstempel sind RFC 3339 (`2026-10-28T12:00:00Z`), außer im Audit-Log
      (`created_at` in Unix-Sekunden).
    - Gelöschte Datensätze werden weich gelöscht (`DeletedAt`).
    - Jede Antwort trägt `X-Request-ID` (auch im Server-Log). Eine vom
      Client mitgeschickte ID wird übernommen, wenn sie
      `^[A-Za-z0-9._:-]{1,64}$` entspricht, sonst erzeugt der Server eine.
  contact:
    name: Statushafen
    url: https://example.com
servers:
  - url: https://example.com
    description: Produktion
  - url: https://staging.example.com
    description: Staging (deployt `develop`)
  - url: http://localhost:8080
    description: Lokale Entwicklung
tags:
  - name: Public
    description: Öffentliche Lese-API der Statusseiten (optional mit Login-Token).
  - name: Auth
    description: Anmeldung per Passwort, OAuth (Google/GitHub) und OIDC je Statusseite.
  - name: Subscriptions
    description: Abonnieren, Bestätigen (Double-Opt-in) und Abbestellen.
  - name: Webhooks
    description: Eingehender Monitoring-Webhook und Webhook-Token.
  - name: Orders
    description: Self-Service-Bestellung neuer Statusseiten.
  - name: Me
    description: Eigenes Konto (Profil, Seiten, Abo, SSO-Verknüpfungen, DSGVO).
  - name: Admin – Pages
    description: Statusseiten, Seiten-Nutzer, Custom Domain, SSO-Konfiguration.
  - name: Admin – Content
    description: Komponenten, Vorfälle, Wartungsfenster, Hinweise, Vorlagen.
  - name: Admin – Translations
    description: Übersetzungen von Vorfällen, Komponenten und Hinweisen.
  - name: Admin – Settings
    description: Sprachen, UI-Texte, Benachrichtigungsvorlagen.
  - name: Admin – Subscribers
    description: Abonnenten einer Statusseite verwalten.
  - name: Admin – Platform
    description: Nutzer, Rollen, Tags, Übersicht, Monitoring, Audit-Log (Global Admin).
  - name: Operations
    description: Healthcheck, Metriken und interne Endpunkte.

paths:
  # ------------------------------------------------------------------
  # Operations
  # ------------------------------------------------------------------
  /healthz:
    get:
      tags: [Operations]
      operationId: healthz
      summary: Healthcheck inkl. Datenbank-Ping
      security: []
      responses:
        "200":
          description: Prozess und Datenbank erreichbar.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
        "500":
          description: Datenbank nicht erreichbar.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: error }
                  message: { type: string }
  /metrics:
    get:
      tags: [Operations]
      operationId: prometheusMetrics
      summary: Prometheus-Metriken (Golden Signals)
      description: Nur registriert, wenn `METRICS_BASIC_AUTH_USER` und `METRICS_BASIC_AUTH_PASSWORD` gesetzt sind.
      security:
        - metricsBasicAuth: []
      responses:
        "200":
          description: Prometheus-Textformat.
          content:
            text/plain:
              schema: { type: string }
        "401":
          description: Basic-Auth fehlt oder ist falsch.
  /api/internal/custom-domain-check:
    get:
      tags: [Operations]
      operationId: internalCustomDomainCheck
      summary: Caddy-On-Demand-TLS-Freigabe einer Custom Domain
      description: |
        Wird von Caddy („ask“-Endpunkt) vor dem Ausstellen eines Zertifikats
        aufgerufen. 200 nur für Domains im Status `verified`/`active`, sonst 404
        (ohne Body). Nur im internen Docker-Netz gedacht. Außerhalb der
        Entwicklung (`APP_ENV` nicht `development`/`test`/`local`) ist
        `CADDY_INTERNAL_TOKEN` Pflicht und `X-Internal-Token` muss passen; ohne
        gesetztes Token antwortet der Endpunkt immer mit 503. Eine freigegebene
        Domain im Status `verified` wird dabei auf `active` gesetzt. Je IP sind
        höchstens 120 Anfragen pro Minute erlaubt, danach antwortet der Endpunkt
        mit 429 `rate_limited`.
      security:
        - internalToken: []
      parameters:
        - name: domain
          in: query
          required: true
          schema: { type: string }
          example: status.example.com
      responses:
        "200": { description: Domain ist freigegeben. }
        "404": { description: Unbekannte/nicht verifizierte Domain oder falscher Token. }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { description: "`CADDY_INTERNAL_TOKEN` ist nicht gesetzt (außerhalb der Entwicklung); es wird nichts freigegeben." }

  # ------------------------------------------------------------------
  # Auth
  # ------------------------------------------------------------------
  /api/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Anmeldung mit E-Mail und Passwort
      security: []
      x-rate-limit: 20/min pro IP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Angemeldet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/auth/{provider}:
    parameters:
      - $ref: "#/components/parameters/OAuthProvider"
    get:
      tags: [Auth]
      operationId: oauthBegin
      summary: OAuth-Login bei Google/GitHub starten
      description: |
        Setzt das Cookie `oauth_state` (5 min, HttpOnly, Secure, SameSite=Lax) und
        leitet zum Anbieter weiter. Das Cookie ist mit `JWT_SECRET` signiert und
        trägt State und PKCE-Verifier; die Authorize-URL enthält die
        `code_challenge` (S256). Für Browser-Navigation gedacht.
      security: []
      x-rate-limit: 20/min pro IP
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "307":
          description: Weiterleitung zum Anbieter.
          headers:
            Location: { $ref: "#/components/headers/Location" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503":
          description: Anbieter nicht konfiguriert (Client-ID fehlt).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/auth/{provider}/callback:
    parameters:
      - $ref: "#/components/parameters/OAuthProvider"
    get:
      tags: [Auth]
      operationId: oauthCallback
      summary: OAuth-Callback des Anbieters
      description: |
        Prüft `state` gegen das signierte Cookie (Signatur, Anbieter, höchstens
        5 Minuten alt, einmal verwendbar), bevor der Anbieter aufgerufen wird;
        sonst `400 oauth_state_invalid`. Tauscht dann den Code (mit dem
        PKCE-Verifier aus dem Cookie), legt den Nutzer bei Bedarf an und leitet auf
        `<FRONTEND_URL>/auth/sso-callback?code=…` weiter. Der kurzlebige `code` wird per `POST /api/auth/sso-exchange`
        gegen einen Login-Token getauscht.
      security: []
      x-rate-limit: 20/min pro IP
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "307":
          description: Weiterleitung ins Frontend mit Einmal-Code.
          headers:
            Location: { $ref: "#/components/headers/Location" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/auth/sso-exchange:
    post:
      tags: [Auth]
      operationId: ssoExchange
      summary: SSO-Einmal-Code gegen Login-Token tauschen
      security: []
      x-rate-limit: 10/min pro IP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: Login-Token.
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string, description: "JWT für `X-Auth-Token` (oder `Authorization: Bearer`). Nach OIDC/SAML einer Statusseite mit Claim `sso_page_id`: Das Token gilt nur für diese Seite und nie mit Global-Admin-Rechten." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/auth/oidc/login:
    get:
      tags: [Auth]
      operationId: oidcLogin
      summary: Login über das OIDC-SSO einer Statusseite starten
      description: |
        Browser-Navigation. Leitet zum Identity Provider der Seite weiter
        (State/Nonce/PKCE, Cookie `oidc_state`). Fehler führen nicht zu einer
        JSON-Antwort, sondern zur Weiterleitung auf
        `<FRONTEND_URL>/login?oidc_error=<code>`.
      security: []
      x-rate-limit: 20/min pro IP
      parameters:
        - name: page
          in: query
          required: true
          description: ID der Statusseite.
          schema: { type: integer, minimum: 1 }
      responses:
        "307":
          description: Weiterleitung zum Anbieter bzw. bei Fehlern ins Frontend.
          headers:
            Location: { $ref: "#/components/headers/Location" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/auth/sso/login:
    get:
      tags: [Auth]
      operationId: ssoLoginBySlug
      summary: Login über das SSO einer Statusseite per Slug starten
      description: |
        Browser-Navigation für Besucher einer privaten Seite, denen
        `GET /api/public/pages/{slug}/sso` Seiten-ID und SSO-Art nicht nennt. Der
        Server wählt das Verfahren (OIDC, wenn aktiv, sonst SAML) und leitet zum
        Identity Provider weiter. Eine unbekannte Seite, eine Seite ohne aktives SSO
        und ein fehlender `slug` enden gleich in der Weiterleitung auf
        `<FRONTEND_URL>/login?oidc_error=not_configured`.
      security: []
      x-rate-limit: 20/min pro IP
      parameters:
        - { name: slug, in: query, required: true, description: Slug der Statusseite., schema: { type: string } }
      responses:
        "307":
          description: Weiterleitung zum Anbieter bzw. bei Fehlern ins Frontend.
          headers:
            Location: { $ref: "#/components/headers/Location" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/auth/oidc/callback:
    get:
      tags: [Auth]
      operationId: oidcCallback
      summary: OIDC-Callback des Identity Providers
      description: |
        Löst den State ein, prüft ID-Token und Nonce und leitet auf
        `<FRONTEND_URL>/auth/sso-callback?code=…` weiter (Code wie bei
        OAuth per `POST /api/auth/sso-exchange` tauschen). Bei
        Verknüpfungen geht es ins Profil, bei Testanmeldungen auf die
        SSO-Seite des Admin-Bereichs; Fehler immer als Weiterleitung mit
        Fehlercode.
      security: []
      x-rate-limit: 20/min pro IP
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "307":
          description: Weiterleitung ins Frontend.
          headers:
            Location: { $ref: "#/components/headers/Location" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/auth/saml/login:
    get:
      tags: [Auth]
      operationId: samlLogin
      summary: Login über das SAML-SSO einer Statusseite starten
      description: |
        Browser-Navigation. Erzeugt einen signierten AuthnRequest
        (HTTP-Redirect-Binding), setzt das Cookie `saml_state`
        (`Secure`, `HttpOnly`, `SameSite=None`, 10 Minuten) und leitet zum
        IdP weiter. Fehler führen wie bei OIDC zur Weiterleitung auf
        `<FRONTEND_URL>/login?oidc_error=<code>` (z. B. `bad_page`,
        `not_configured`, `metadata_invalid`, `provider_unreachable`).
      security: []
      x-rate-limit: 20/min pro IP
      parameters:
        - name: page
          in: query
          required: true
          description: ID der Statusseite.
          schema: { type: integer, minimum: 1 }
      responses:
        "307":
          description: Weiterleitung zum IdP bzw. bei Fehlern ins Frontend.
          headers:
            Location: { $ref: "#/components/headers/Location" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/auth/saml/{page_id}/metadata:
    parameters:
      - $ref: "#/components/parameters/PageId"
    get:
      tags: [Auth]
      operationId: samlMetadata
      summary: SAML-SP-Metadaten der Statusseite
      description: |
        EntityDescriptor des Service Providers (Entity-ID = diese URL,
        ACS = `/api/auth/saml/{page_id}/acs` mit HTTP-POST-Binding,
        SP-Signaturzertifikat). Zum Import beim IdP. Verfügbar, sobald für
        die Seite ein SP-Schlüssel erzeugt wurde (beim ersten Speichern der
        SAML-Konfiguration), auch wenn SAML noch nicht aktiv ist. Auch für
        private Seiten (IdPs laden die Metadaten per URL), für gelöschte 404.
        Nur Signaturzertifikat, NameID-Format persistent (bzw. unspecified,
        wenn freigegeben); verschlüsselte Assertions werden nicht angeboten.
      security: []
      x-rate-limit: 60/min pro IP
      responses:
        "200":
          description: SP-Metadaten.
          content:
            application/samlmetadata+xml:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/auth/saml/{page_id}/acs:
    parameters:
      - $ref: "#/components/parameters/PageId"
    post:
      tags: [Auth]
      operationId: samlACS
      summary: Assertion Consumer Service (Formular-POST des IdP)
      description: |
        Der Browser schickt die SAML-Antwort per HTTP-POST-Binding von der
        Origin des IdP; die Route läuft deshalb ohne CORS-Prüfung (und ohne
        CORS-Header). `RelayState` muss zum Cookie `saml_state` passen und
        der Login-State zur Seite im Pfad. Geprüft werden Signatur,
        Audience, Recipient/Destination, Gültigkeit, `InResponseTo`,
        Einmaligkeit der Assertion (Replay-Schutz) und eine dauerhafte
        NameID. Body höchstens 1 MB.

        Ergebnis ist immer eine 303-Weiterleitung: Erfolg auf
        `<FRONTEND_URL>/auth/sso-callback?code=…` (Code per
        `POST /api/auth/sso-exchange` tauschen; bei Verknüpfung mit
        `&next=profile`), Testanmeldung auf `/admin/sso?oidc_test=ok&sso=saml…`,
        Fehler auf `/login?oidc_error=<code>` (Verknüpfung:
        `/admin/profile?oidc_error=`, Test: `/admin/sso?oidc_test=`).
        Fehlercodes: `saml_response_invalid`, `saml_replay`, `saml_nameid_format`, `metadata_invalid`, `provider_unreachable`, `provider_denied`, `state_invalid`, `not_linked`, `already_linked`, `not_configured`, `test_disabled`, `internal`.
      security: []
      x-rate-limit: 20/min pro IP
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [SAMLResponse, RelayState]
              properties:
                SAMLResponse: { type: string, description: Base64-kodierte samlp:Response. }
                RelayState: { type: string, description: State aus dem Login-Start. }
      responses:
        "303":
          description: Weiterleitung ins Frontend (Erfolg oder Fehlercode).
          headers:
            Location: { $ref: "#/components/headers/Location" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/auth/saml/link:
    post:
      tags: [Me]
      operationId: samlLink
      summary: Eigenes Konto mit dem SAML-SSO einer Statusseite verknüpfen
      description: |
        Wie `POST /api/auth/oidc/link`: liefert die IdP-URL als JSON. Für
        Global Admins und Konten mit Rolle auf einer anderen Seite gesperrt.
        Eine OIDC-Verknüpfung derselben Seite zählt für SAML nicht.
      x-required-permission: authenticated
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: URL zum IdP, im Browser zu öffnen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UrlResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /api/auth/oidc/link:
    post:
      tags: [Me]
      operationId: oidcLink
      summary: Eigenes Konto mit dem SSO einer Statusseite verknüpfen
      description: |
        Liefert die Authorize-URL als JSON (ein Redirect würde den
        Authorization-Header nicht mitschicken). Für Global Admins und Konten
        mit Rolle auf einer anderen Seite gesperrt.
      x-required-permission: authenticated
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Authorize-URL, im Browser zu öffnen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UrlResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  # ------------------------------------------------------------------
  # Public
  # ------------------------------------------------------------------
  /api/public/pages:
    get:
      tags: [Public]
      operationId: listPublicPages
      summary: Öffentlich gelistete Statusseiten
      description: |
        Seiten mit `IsPublicIndexed=true` und `IsPrivate=false`, nach ID
        aufsteigend. Ein Aufruf liefert höchstens 200 Seiten; weitere über
        `offset` (höchstens 100000). `Name` ist auf 120 und `Description` auf
        500 Zeichen gekürzt (eine Kürzung endet mit „…“); den vollen Text liefert
        die Seite selbst. Ungültiges `limit`/`offset` ergibt `400 invalid_request`.
      security: &optionalBearer
        - {}
        - bearerAuth: []
      x-rate-limit: 120/min pro IP
      parameters:
        - { name: limit, in: query, required: false, description: "1–200, Standard 200.", schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }
        - { name: offset, in: query, required: false, description: "0–100000, Standard 0.", schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: Liste der Seiten.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicStatusPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/public/pages/{slug}/dashboard:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      tags: [Public]
      operationId: getPublicDashboard
      summary: Komplettes Dashboard einer Statusseite
      description: |
        Seite, Komponentenbaum, Vorfälle und aktive Hinweise in einer
        Antwort. Der Komponentenstatus wird für diese Antwort mit offenen
        Vorfällen überlagert (ein offener Vorfall zeigt nicht mehr
        „operational“).

        Private Seiten: Zugriff mit Login-Token (Global Admin, Rolle auf der
        Seite oder Auto-Join per Standardrolle/E-Mail-Domain – dabei wird
        die Rolle angelegt) oder mit dem Subscriber-Token aus einer
        Benachrichtigungsmail (`?token=`).

        Die Vorfälle sind begrenzt: alle offenen (höchstens 200) plus die neuesten
        behobenen (`incident_limit`, Standard 50, höchstens 200). `incidents_more`
        meldet, dass es ältere behobene gibt; sie lassen sich über
        `GET /api/pages/{page_id}/incidents?is_maintenance=any&state=resolved&offset=…`
        nachladen. Ein ungültiger `incident_limit` ergibt `400`.
      security:
        - {}
        - bearerAuth: []
        - subscriberToken: []
      x-rate-limit: 120/min pro IP
      parameters:
        - name: incident_limit
          in: query
          required: false
          description: Anzahl der gelieferten behobenen Vorfälle (mindestens 1, über 200 wird auf 200 gekappt).
          schema: { type: integer, minimum: 1, default: 50 }
      responses:
        "200":
          description: Dashboard.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/public/pages/{slug}/availability:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      tags: [Public]
      operationId: getPublicAvailability
      summary: Verfügbarkeit der letzten 90 Tage (Tagesaggregate)
      description: |
        pro UTC-Tag der letzten 90 Tage (inkl. heute, älteste
        zuerst) der schlechteste Status und die Verfügbarkeit in Prozent,
        für die Gesamtseite und auf Wunsch je Komponente.

        Datenquellen sind Vorfälle, Wartungsfenster und die Statushistorie
        der Komponenten (jeder Wechsel von `Component.Status`;
        bei Webhook-Flattern höchstens zwei Einträge je 30-Sekunden-Fenster,
        pessimistisch: das Fenster zählt als schlimmster Status).
        Ein Vorfall zählt wie im Dashboard
        als `degraded_performance` und als Beeinträchtigung; Überlappungen
        zählen einmal (der schlimmste Status gewinnt). Wartung setzt den Tagesstatus `under_maintenance`,
        zählt aber nicht als Ausfall. Die Verfügbarkeit ist nach Dauer
        gewichtet (heute nur bis jetzt). Tage vor Anlage der Seite (bzw. vor
        dem frühesten Vorfall) haben `status: no_data` und `availability: null`
        statt 100 %. Ein vorfallsloser Tag ist `operational` mit 100.

        Berücksichtigt werden nur nicht gelöschte Komponenten dieser Seite;
        Gruppen erscheinen nicht als Zeile, ein Vorfall an einer Gruppe zählt
        für deren Kinder. Zugriff wie beim Dashboard (private Seiten nur mit
        Login-Berechtigung oder Subscriber-Token `?token=`). Antwort 60 s
        zwischengespeichert.
      security:
        - {}
        - bearerAuth: []
        - subscriberToken: []
      x-rate-limit: 60/min pro IP
      parameters:
        - name: include
          in: query
          required: false
          description: "`components` ergänzt die Tageswerte je Komponente (Antwort wächst um 90 Tage je Komponente)."
          schema: { type: string, enum: [components] }
      responses:
        "200":
          description: Tagesaggregate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Availability" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/public/pages/{slug}/incidents/{incident_id}/update-translations:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/IncidentId"
    get:
      tags: [Public]
      operationId: getPublicIncidentUpdateTranslations
      summary: Bestätigte Übersetzungen der Updates eines Vorfalls
      description: |
        Die Nachrichten der Updates eines Vorfalls in der Sprache des
        Besuchers. Je Update gilt: bestätigte Übersetzung in `lang`, sonst
        bestätigte Übersetzung in der Standardsprache der Seite, sonst fehlt der
        Eintrag und die Statusseite zeigt die Originalnachricht. Entwürfe kommen
        nie vor. Klartext (kein HTML). Ohne `lang` gilt die Standardsprache der
        Seite. Der Vorfall muss zur Seite gehören (sonst 404). Zugriff wie beim
        Dashboard (private Seiten nur mit Login-Berechtigung oder
        Subscriber-Token `?token=`).
      security:
        - {}
        - bearerAuth: []
        - subscriberToken: []
      x-rate-limit: 60/min pro IP
      parameters:
        - name: lang
          in: query
          required: false
          description: Sprachcode (klein geschrieben, z. B. `en`); muss eine Sprache der Seite sein, sonst 400.
          schema: { type: string }
      responses:
        "200":
          description: Nachrichten, Schlüssel = ID des Updates.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicUpdateTranslations" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/public/pages/{slug}/translations:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      tags: [Public]
      operationId: getPublicTranslations
      summary: Bestätigte Übersetzungen der Statusseite in einer Sprache
      description: |
        alle Übersetzungen, die die öffentliche Statusseite braucht, in
        einer Antwort (statt ein Abruf je Komponente, Vorfall oder Ankündigung).

        Je Objekt gilt: bestätigte Übersetzung in `lang`, sonst bestätigte
        Übersetzung in der Standardsprache der Seite, sonst fehlt der Eintrag und
        die Statusseite zeigt das Original. Entwürfe kommen nie vor. Enthalten sind
        nur die Objekte, die auch das Dashboard zeigt: sichtbare Komponenten
        (samt Gruppen), Vorfälle der Seite und aktive Ankündigungen im Zeitfenster.
        Alle Texte sind Klartext (kein HTML). Ohne `lang` gilt die Standardsprache
        der Seite. Zugriff wie beim Dashboard (private Seiten nur mit
        Login-Berechtigung oder Subscriber-Token `?token=`). Antwort je Seite und
        Sprache 60 s zwischengespeichert.
      security:
        - {}
        - bearerAuth: []
        - subscriberToken: []
      x-rate-limit: 60/min pro IP
      parameters:
        - name: lang
          in: query
          required: false
          description: Sprachcode (klein geschrieben, z. B. `en`); muss eine Sprache der Seite sein, sonst 400.
          schema: { type: string }
      responses:
        "200":
          description: Übersetzungen, Schlüssel = ID des Objekts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicTranslations" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/public/pages/{slug}/sso:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      tags: [Public]
      operationId: getPublicPageSSO
      summary: Ist das Seiten-SSO aktiv?
      description: |
        Liefert nur die Schalter je Protokoll und die Seiten-ID für den Login-Link
        (`/api/auth/oidc/login?page=<page_id>` bzw. `/api/auth/saml/login?page=<page_id>`),
        keine Konfiguration. Bei einer privaten Seite nur mit Rolle auf der Seite
        oder als Global Admin (Login-Token); für alle anderen antwortet die Route
        wie bei einer nicht vorhandenen Seite mit `404`. Besucher einer privaten
        Seite starten das SSO über `GET /api/auth/sso/login?slug=…`.
      security: *optionalBearer
      x-rate-limit: 60/min pro IP
      responses:
        "200":
          description: SSO-Status.
          content:
            application/json:
              schema:
                type: object
                required: [oidc_enabled, saml_enabled, page_id]
                properties:
                  oidc_enabled: { type: boolean }
                  saml_enabled: { type: boolean }
                  page_id: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/public/ui-overrides:
    get:
      tags: [Public]
      operationId: getPublicUiOverrides
      summary: Globale UI-Text-Overrides einer Sprache
      security: *optionalBearer
      x-rate-limit: 120/min pro IP
      parameters:
        - $ref: "#/components/parameters/LanguageCodeQuery"
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: Schlüssel → Text.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UiOverrideMap" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/public/resolve-domain:
    get:
      tags: [Public]
      operationId: resolveCustomDomain
      summary: Custom Domain auf Seiten-Slug abbilden
      description: Nur Domains im Status `verified`/`active`; der Status wird dabei nicht verändert (das Hochstufen auf `active` geschieht im internen Domain-Check). Private Seiten liefern den Slug nur an Mitglieder, sonst 404 wie bei einer unbekannten Domain.
      security: *optionalBearer
      x-rate-limit: 60/min pro IP
      parameters:
        - name: host
          in: query
          required: true
          schema: { type: string }
          example: status.example.com
      responses:
        "200":
          description: Slug der Seite.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlugResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/pages/slug/{slug}:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      tags: [Public]
      operationId: getPageBySlug
      summary: Metadaten einer Statusseite per Slug
      description: Private Seiten ohne Berechtigung liefern 404 (nicht 403), damit ihre Existenz nicht erkennbar ist.
      security: *optionalBearer
      x-rate-limit: 120/min pro IP
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: Statusseite.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicStatusPage" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/pages/{page_id}/components:
    parameters:
      - $ref: "#/components/parameters/PageId"
    get:
      tags: [Public]
      operationId: listComponents
      summary: Komponentenbaum einer Statusseite
      description: Liefert in `Status` den manuell gesetzten Status (ohne Überlagerung durch offene Vorfälle, anders als das Dashboard), dazu `effective_status` und `external_sources`.
      security: *optionalBearer
      x-rate-limit: 120/min pro IP
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: Wurzelkomponenten mit `Children`.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Component" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Admin – Content]
      operationId: createComponent
      summary: Komponente anlegen
      x-required-permission: components:create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComponentCreate" }
      responses:
        "201":
          description: Angelegt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Component" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/pages/{page_id}/incidents:
    parameters:
      - $ref: "#/components/parameters/PageId"
    get:
      tags: [Public]
      operationId: listIncidents
      summary: Vorfälle bzw. Wartungsfenster einer Statusseite
      description: |
        Neueste zuerst (nach `StartedAt`, sonst `CreatedAt`, bei Gleichstand nach ID).
        Mit Login-Token zusätzlich nach Tag-Zugriff des Nutzers gefiltert.
        Die Liste ist immer begrenzt: ohne `limit` die neuesten 50, höchstens 200 je
        Aufruf; weiter zurück mit `offset` blättern (höchstens 100000). Eine volle Seite
        heißt, dass es weitere geben kann.
      security: *optionalBearer
      x-rate-limit: 120/min pro IP
      parameters:
        - name: is_maintenance
          in: query
          required: false
          description: "`true` liefert Wartungsfenster statt Vorfällen, `any` beides."
          schema: { type: string, enum: ["true", "false", any], default: "false" }
        - name: state
          in: query
          required: false
          description: "`open` nur offene, `resolved` nur behobene; ohne Angabe alle."
          schema: { type: string, enum: [open, resolved] }
        - name: limit
          in: query
          required: false
          description: Anzahl je Aufruf (mindestens 1, über 200 wird auf 200 gekappt).
          schema: { type: integer, minimum: 1, default: 50 }
        - name: offset
          in: query
          required: false
          description: Zeilen, die übersprungen werden (0 bis 100000).
          schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
      responses:
        "200":
          description: Vorfälle.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Incident" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Admin – Content]
      operationId: createIncident
      summary: Vorfall oder Wartungsfenster anlegen
      x-rate-limit: 30/Stunde je Seite, 60/Stunde je Nutzer (`429 rate_limited`)
      description: Löst Benachrichtigungen an Team und Abonnenten aus. Bei `IsMaintenance` sind Start/Ende Pflicht, der Status wird aus den Zeiten abgeleitet, wenn er fehlt. Der Body ist auf 64 KiB begrenzt (größer als 64 KiB ergibt 413 `request_too_large`); ein unlesbarer Body ergibt 400. Für `IsMaintenance` wird `maintenance:create` zusätzlich im Handler geprüft (403).
      x-required-permission: incidents:create|maintenance:create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentCreate" }
      responses:
        "201":
