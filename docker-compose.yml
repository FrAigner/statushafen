version: '3.8'

# Alle Ports sind nur an 127.0.0.1 gebunden: Die Datenbank (Standardpasswort) und der
# Mailfänger (ohne Anmeldung) gehören nicht ins lokale Netz. Der Strukturtest
# backend/compose_ports_test.go hält das fest.
services:
  db:
    image: postgres:16-alpine
    container_name: statushafen_db
    environment:
      POSTGRES_DB: statushafen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localpassword
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    container_name: statushafen_mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  # Mock-OIDC-Anbieter für lokale Tests des Seiten-SSO.
  # Nur mit Profil: docker compose --profile sso up -d mock-oidc
  # Issuer: http://localhost:8090/<beliebige-id>, z.B. .../statushafen. Der Mock
  # leitet den Issuer aus dem Host-Header ab; Browser und Backend müssen ihn
  # deshalb unter derselben Adresse (localhost:8090) erreichen, das Backend
  # läuft dafür wie gewohnt direkt auf dem Host (start.sh). Anleitung: README,
  # Abschnitt "Lokale SSO-Tests mit Mock-OIDC".
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.5
    container_name: statushafen_mock_oidc
    profiles: ["sso"]
    environment:
      SERVER_PORT: "8090"
      # interactiveLogin: Anmeldeformular, in dem man den sub-Claim (username)
      # und weitere Claims (JSON) selbst wählt; ohne es vergibt der Mock bei
      # jedem Login ein zufälliges sub, eine Verknüpfung hielte dann nicht.
      JSON_CONFIG: '{"interactiveLogin": true, "httpServer": "NettyWrapper"}'
    ports:
      - "127.0.0.1:8090:8090"
    restart: unless-stopped

  # Mock-SAML-IdP für lokale Tests der SAML-Anmeldung je
  # Statusseite. Nur mit Profil: docker compose --profile sso up -d mock-saml
  # Kein fertiges Image: Bestehende Test-IdPs (SimpleSAMLphp u. a.) kennen nur
  # fest eingetragene Service Provider, die Entity-ID hängt hier aber an der
  # Seiten-ID. Der Mock (backend/cmd/mocksamlidp) nimmt jeden SP an, dessen
  # ACS-URL mit MOCK_SAML_ACS_PREFIX beginnt. Gleiche Go-Version wie das
  # Dockerfile; der Quellcode wird nur gelesen. Anleitung: README, Abschnitt
  # "Lokale SSO-Tests mit Mock-SAML".
  mock-saml:
    image: golang:1.27.0-alpine
    container_name: statushafen_mock_saml
    profiles: ["sso"]
    working_dir: /src
    volumes:
      - ./backend:/src:ro
    environment:
      MOCK_SAML_ADDR: ":8091"
      MOCK_SAML_URL: "http://localhost:8091"
      MOCK_SAML_ACS_PREFIX: "http://localhost:8080/api/auth/saml/"
      GOFLAGS: "-buildvcs=false"
    command: ["go", "run", "./cmd/mocksamlidp"]
    ports:
      - "127.0.0.1:8091:8091"
    restart: unless-stopped

volumes:
  postgres_data:
